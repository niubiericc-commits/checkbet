<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPORTS+</title>

<style>
:root {
    --bg: #070b11;
    --bg2: #0b111a;
    --panel: #101824;
    --panel2: #151f2e;
    --panel3: #1b2839;
    --border: #26364b;
    --border2: #31445d;
    --text: #f4f7fb;
    --muted: #8e9bae;
    --green: #52e58a;
    --red: #ff6b6b;
    --yellow: #f1c75b;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, Helvetica, Arial, sans-serif;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

header {
    height: 64px;
    padding: 0 22px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: rgba(10, 15, 23, .97);
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 23px;
    font-weight: 900;
}

.logo span {
    color: var(--green);
}

.header-center {
    margin-left: 30px;
    color: var(--muted);
    font-size: 12px;
}

.header-right {
    margin-left: auto;
}

.api-status {
    color: var(--muted);
    font-size: 12px;
}

.api-status.ok {
    color: var(--green);
}

.api-status.error {
    color: var(--red);
}

.layout {
    min-height: calc(100vh - 64px);
    display: grid;
    grid-template-columns: 225px minmax(0, 1fr) 340px;
}

/* ============================
   SIDEBAR
============================ */

.sidebar {
    background: var(--bg2);
    border-right: 1px solid var(--border);
    padding: 15px 10px;
    position: sticky;
    top: 64px;
    height: calc(100vh - 64px);
    overflow-y: auto;
}

.sidebar-title {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 9px 11px;
}

.league {
    width: 100%;
    border: 0;
    color: #dbe3ed;
    background: transparent;
    padding: 11px 12px;
    border-radius: 8px;
    text-align: left;
    margin-bottom: 3px;
}

.league:hover {
    background: var(--panel2);
}

.league.active {
    background: var(--panel3);
    color: var(--green);
    font-weight: 800;
}

/* ============================
   MAIN
============================ */

.main {
    min-width: 0;
    padding: 18px;
}

.topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
}

.page-title {
    font-size: 20px;
    font-weight: 900;
    white-space: nowrap;
}

.search {
    min-width: 0;
    flex: 1;
    background: var(--panel);
    color: white;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 11px 13px;
    outline: none;
}

.search:focus {
    border-color: var(--green);
}

.refresh-btn {
    background: var(--panel2);
    color: white;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 11px 15px;
}

.refresh-btn:hover {
    border-color: var(--green);
}

.info-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 15px;
}

.info-pill {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 10px;
    border-radius: 20px;
    font-size: 11px;
}

/* ============================
   EVENTS
============================ */

.event-card {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
}

.event-card.open {
    border-color: var(--border2);
}

.event-header {
    display: grid;
    grid-template-columns: 115px minmax(0, 1fr) auto;
    align-items: center;
    gap: 13px;
    padding: 15px;
    cursor: pointer;
}

.event-header:hover {
    background: var(--panel2);
}

.event-time {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
}

.team {
    font-weight: 750;
    margin: 3px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.event-action {
    color: var(--green);
    font-size: 12px;
    white-space: nowrap;
}

.event-detail {
    display: none;
    border-top: 1px solid var(--border);
    padding: 15px;
    background: #0e1621;
}

.event-card.open .event-detail {
    display: block;
}

/* ============================
   DETAIL
============================ */

.detail-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
}

.detail-head-left {
    flex: 1;
}

.detail-title {
    font-size: 17px;
    font-weight: 900;
}

.detail-meta {
    color: var(--muted);
    font-size: 11px;
    margin-top: 5px;
}

.close-btn {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 7px;
    padding: 7px 10px;
}

.market-nav {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 9px;
    margin-bottom: 11px;
}

.market-nav-btn {
    flex: 0 0 auto;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: #dbe3ed;
    border-radius: 7px;
    padding: 7px 10px;
    font-size: 11px;
}

.market-nav-btn:hover {
    color: var(--green);
    border-color: var(--green);
}

.market-section {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 11px;
    background: var(--panel);
}

.market-header {
    padding: 11px 12px;
    font-size: 13px;
    font-weight: 850;
    background: var(--panel2);
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.market-count {
    color: var(--green);
    font-size: 11px;
    font-weight: 500;
}

.outcomes-container {
    padding: 10px;
}

.outcome-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
    gap: 7px;
}

.odd-btn {
    min-width: 0;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: white;
    border-radius: 8px;
    padding: 9px 10px;
    text-align: left;
    transition: .12s ease;
}

.odd-btn:hover {
    border-color: var(--green);
    transform: translateY(-1px);
}

.odd-btn.selected {
    border-color: var(--green);
    background: rgba(82, 229, 138, .12);
}

.odd-name {
    color: #e8edf3;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.odd-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 8px;
    margin-top: 7px;
}

.odd-point {
    color: var(--muted);
    font-size: 11px;
}

.odd-price {
    color: var(--green);
    font-size: 14px;
    font-weight: 900;
}

.odd-source {
    margin-top: 5px;
    color: #657489;
    font-size: 9px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.loading,
.empty-state,
.error-state {
    padding: 30px 15px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
}

.error-state {
    color: var(--red);
}

.loader {
    width: 25px;
    height: 25px;
    border: 3px solid var(--border);
    border-top-color: var(--green);
    border-radius: 50%;
    margin: 0 auto 12px;
    animation: spin .7s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* ============================
   BET SLIP
============================ */

.betslip {
    background: var(--bg2);
    border-left: 1px solid var(--border);
    padding: 16px;
    position: sticky;
    top: 64px;
    height: calc(100vh - 64px);
    overflow-y: auto;
}

.bet-title {
    font-size: 18px;
    font-weight: 900;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 13px;
}

.clear-btn {
    border: 0;
    background: transparent;
    color: var(--red);
    font-size: 11px;
}

.pick-empty {
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    padding: 25px 5px;
}

.pick {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
}

.pick-top {
    display: flex;
    justify-content: space-between;
    gap: 8px;
}

.pick-market {
    color: var(--muted);
    font-size: 10px;
}

.pick-remove {
    border: 0;
    background: transparent;
    color: var(--red);
    padding: 0;
}

.pick-selection {
    margin-top: 5px;
    font-weight: 800;
    font-size: 13px;
}

.pick-event {
    color: var(--muted);
    font-size: 10px;
    line-height: 1.4;
    margin-top: 5px;
}

.pick-price {
    color: var(--green);
    font-size: 14px;
    font-weight: 900;
    margin-top: 6px;
}

.stake-label {
    color: var(--muted);
    font-size: 11px;
    margin-top: 16px;
    margin-bottom: 6px;
}

.stake {
    width: 100%;
    background: var(--panel);
    color: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px;
    outline: none;
}

.summary {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 12px;
    margin-top: 12px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 12px;
    margin: 8px 0;
}

.summary-row span:first-child {
    color: var(--muted);
}

.summary-value {
    font-weight: 800;
}

.summary-value.green {
    color: var(--green);
}

.simulation-note {
    color: var(--muted);
    font-size: 10px;
    line-height: 1.5;
    margin-top: 13px;
}

/* ============================
   RESPONSIVE
============================ */

@media (max-width: 1100px) {
    .layout {
        grid-template-columns: 190px minmax(0, 1fr);
    }

    .betslip {
        display: none;
    }
}

@media (max-width: 720px) {
    header {
        padding: 0 13px;
    }

    .header-center {
        display: none;
    }

    .layout {
        display: block;
    }

    .sidebar {
        position: static;
        width: 100%;
        height: auto;
        display: flex;
        gap: 5px;
        overflow-x: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        padding: 8px;
    }

    .sidebar-title {
        display: none;
    }

    .league {
        width: auto;
        flex: 0 0 auto;
        white-space: nowrap;
        margin: 0;
    }

    .main {
        padding: 11px;
    }

    .page-title {
        display: none;
    }

    .event-header {
        grid-template-columns: 80px minmax(0, 1fr);
    }

    .event-action {
        grid-column: 2;
    }

    .outcome-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}
</style>
</head>

<script>
"use strict";


/* ============================================================
   STATE
============================================================ */

let currentSport =
    "soccer_epl";

let currentLeagueName =
    "英格兰超级联赛";

let currentEvents = [];

let openedEventId = null;

const detailCache =
    new Map();

let picks = [];


try {

    const saved =
        JSON.parse(
            localStorage.getItem(
                "sportsPlusPicks"
            ) || "[]"
        );

    if (Array.isArray(saved)) {
        picks = saved;
    }

} catch {

    picks = [];

}


/* ============================================================
   MARKET TRANSLATION
============================================================ */

const MARKET_NAMES = {

    h2h:
        "胜平负",

    spreads:
        "让球",

    totals:
        "全场大小球",

    alternate_spreads:
        "更多让球",

    alternate_totals:
        "更多大小球",

    double_chance:
        "双重机会",

    draw_no_bet:
        "平局退款",

    btts:
        "两队都进球",

    team_totals:
        "球队进球大小",

    alternate_team_totals:
        "球队更多进球大小",

    correct_score:
        "正确比分",

    correct_score_h1:
        "半场正确比分",

    h2h_h1:
        "半场胜平负",

    spreads_h1:
        "半场让球",

    totals_h1:
        "半场大小球",

    btts_h1:
        "半场两队进球",

    halftime_fulltime:
        "半场 / 全场",

    corners:
        "总角球",

    alternate_corners:
        "更多角球",

    team_corners:
        "球队角球",

    alternate_team_corners:
        "球队更多角球",

    cards:
        "总牌数",

    alternate_cards:
        "更多牌数",

    player_goal_scorer_anytime:
        "球员任意时间进球",

    player_goal_scorer_first:
        "第一进球球员",

    player_goal_scorer_last:
        "最后进球球员",

    player_shots:
        "球员射门",

    player_shots_on_target:
        "球员射正",

    player_assists:
        "球员助攻",

    player_cards:
        "球员牌数",

    player_to_receive_card:
        "球员吃牌",

    player_to_receive_red_card:
        "球员红牌"
};


const MARKET_PRIORITY = [

    "h2h",

    "double_chance",

    "draw_no_bet",

    "spreads",

    "alternate_spreads",

    "totals",

    "alternate_totals",

    "btts",

    "team_totals",

    "alternate_team_totals",

    "h2h_h1",

    "spreads_h1",

    "totals_h1",

    "btts_h1",

    "halftime_fulltime",

    "correct_score",

    "correct_score_h1",

    "corners",

    "alternate_corners",

    "team_corners",

    "alternate_team_corners",

    "cards",

    "alternate_cards",

    "player_goal_scorer_anytime",

    "player_goal_scorer_first",

    "player_goal_scorer_last",

    "player_shots",

    "player_shots_on_target",

    "player_assists",

    "player_cards",

    "player_to_receive_card",

    "player_to_receive_red_card"
];


/* ============================================================
   BASIC HELPERS
============================================================ */

function escapeHtml(value) {

    return String(value ?? "")

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


function escapeJs(value) {

    return String(value ?? "")

        .replaceAll(
            "\\",
            "\\\\"
        )

        .replaceAll(
            "'",
            "\\'"
        );
}


function safeId(value) {

    return String(value ?? "")

        .replace(
            /[^a-zA-Z0-9_-]/g,
            ""
        );
}


function marketName(key) {

    if (MARKET_NAMES[key]) {

        return MARKET_NAMES[key];

    }


    return String(key)

        .replaceAll(
            "_",
            " "
        )

        .replace(
            /\b\w/g,
            letter =>
                letter.toUpperCase()
        );
}


function marketPriority(key) {

    const index =
        MARKET_PRIORITY.indexOf(key);


    return index === -1
        ? 999
        : index;
}


function formatDate(iso) {

    if (!iso) {

        return "时间待定";

    }


    const date =
        new Date(iso);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return iso;

    }


    return date.toLocaleString(

        "zh-CN",

        {

            month:
                "2-digit",

            day:
                "2-digit",

            hour:
                "2-digit",

            minute:
                "2-digit"

        }

    );
}


/* ============================================================
   API STATUS
============================================================ */

function setApiStatus(
    text,
    type = ""
) {

    const element =
        document.getElementById(
            "quotaText"
        );


    element.textContent =
        text;


    element.className =
        "api-status" +
        (
            type
                ? ` ${type}`
                : ""
        );
}


function updateQuota(quota) {

    if (!quota) {

        setApiStatus(
            "服务器已连接",
            "ok"
        );

        return;

    }


    const remaining =
        quota.remaining;


    if (
        remaining !== null &&
        remaining !== undefined &&
        remaining !== ""
    ) {

        setApiStatus(

            `API 剩余 ${remaining}`,

            "ok"

        );

    } else {

        setApiStatus(

            "服务器已连接",

            "ok"

        );

    }
}


/* ============================================================
   API REQUEST
============================================================ */

async function apiRequest(url) {

    const response =
        await fetch(

            url,

            {

                method:
                    "GET",

                cache:
                    "no-store",

                headers: {

                    "Accept":
                        "application/json"

                }

            }

        );


    const text =
        await response.text();


    let data;


    try {

        data =
            JSON.parse(text);

    } catch {

        throw new Error(

            `服务器返回非 JSON 内容。HTTP ${response.status}：` +

            text.substring(
                0,
                200
            )

        );

    }


    if (!response.ok) {

        throw new Error(

            data?.error ||

            data?.message ||

            `HTTP ${response.status}`

        );

    }


    updateQuota(
        data?.quota
    );


    return data;
}


/* ============================================================
   CHECK SERVER
============================================================ */

async function checkStatus() {

    try {

        const data =
            await apiRequest(
                "/api/status"
            );


        if (
            data.server ===
            "SPORTS+ DETAIL"
        ) {

            setApiStatus(

                "SPORTS+ DETAIL 已连接",

                "ok"

            );

        } else {

            setApiStatus(

                `服务器：${data.server || "已连接"}`,

                "ok"

            );

        }

    } catch (error) {

        console.error(
            error
        );


        setApiStatus(

            "服务器连接失败",

            "error"

        );

    }
}


/* ============================================================
   LOAD EVENTS
============================================================ */

async function loadEvents() {

    openedEventId = null;


    const container =
        document.getElementById(
            "eventsContainer"
        );


    container.innerHTML = `

        <div class="loading">

            <div class="loader"></div>

            正在读取
            ${escapeHtml(currentLeagueName)}
            比赛

        </div>

    `;


    try {

        const data =
            await apiRequest(

                `/api/events/${encodeURIComponent(currentSport)}`

            );


        currentEvents =
            Array.isArray(
                data.events
            )
                ? data.events
                : [];


        document.getElementById(
            "lastUpdated"
        ).textContent =

            "更新 " +

            new Date().toLocaleTimeString(

                "zh-CN",

                {

                    hour:
                        "2-digit",

                    minute:
                        "2-digit"

                }

            );


        renderEvents();

    } catch (error) {

        console.error(
            "LOAD EVENTS:",
            error
        );


        container.innerHTML = `

            <div class="error-state">

                ${escapeHtml(error.message)}

            </div>

        `;


        document.getElementById(
            "eventCount"
        ).textContent =
            "比赛 0";

    }
}


/* ============================================================
   RENDER EVENTS
============================================================ */

function renderEvents() {

    const container =
        document.getElementById(
            "eventsContainer"
        );


    const search =
        document.getElementById(
            "searchInput"
        )

        .value

        .trim()

        .toLowerCase();


    const filtered =
        currentEvents.filter(
            event => {

                const text =

                    `${event.home_team || ""} ` +

                    `${event.away_team || ""}`;


                return (

                    !search ||

                    text
                        .toLowerCase()
                        .includes(search)

                );

            }
        );


    document.getElementById(
        "eventCount"
    ).textContent =

        `比赛 ${filtered.length}`;


    if (!filtered.length) {

        container.innerHTML = `

            <div class="empty-state">

                当前没有找到比赛

            </div>

        `;

        return;
    }


    container.innerHTML =

        filtered.map(
            event => {

                const isOpen =

                    openedEventId ===
                    event.id;


                return `

                    <section

                        id="event-card-${escapeHtml(event.id)}"

                        class="event-card ${isOpen ? "open" : ""}">


                        <div

                            class="event-header"

                            onclick="toggleEvent('${escapeJs(event.id)}')">


                            <div class="event-time">

                                ${escapeHtml(
                                    formatDate(
                                        event.commence_time
                                    )
                                )}

                            </div>


                            <div class="event-teams">

                                <div class="team">

                                    ${escapeHtml(
                                        event.home_team
                                    )}

                                </div>


                                <div class="team">

                                    ${escapeHtml(
                                        event.away_team
                                    )}

                                </div>

                            </div>


                            <div class="event-action">

                                ${
                                    isOpen
                                        ? "收起 ▲"
                                        : "查看全部盘口 ›"
                                }

                            </div>

                        </div>


                        <div

                            id="event-detail-${escapeHtml(event.id)}"

                            class="event-detail">

                        </div>

                    </section>

                `;

            }

        ).join("");


    if (
        openedEventId &&
        detailCache.has(
            openedEventId
        )
    ) {

        const detail =
            document.getElementById(

                `event-detail-${openedEventId}`

            );


        if (detail) {

            renderDetailedOdds(

                detail,

                detailCache.get(
                    openedEventId
                )

            );

        }

    }
}


/* ============================================================
   OPEN EVENT
============================================================ */

async function toggleEvent(eventId) {

    if (
        openedEventId ===
        eventId
    ) {

        openedEventId = null;

        renderEvents();

        return;

    }


    openedEventId =
        eventId;


    renderEvents();


    const detail =
        document.getElementById(

            `event-detail-${eventId}`

        );


    if (!detail) {

        return;

    }


    if (
        detailCache.has(
            eventId
        )
    ) {

        renderDetailedOdds(

            detail,

            detailCache.get(
                eventId
            )

        );

        return;

    }


    detail.innerHTML = `

        <div class="loading">

            <div class="loader"></div>

            正在查询全部可用盘口

        </div>

    `;


    try {

        /*
         * 1. 查询比赛支持的 markets
         */

        const marketData =
            await apiRequest(

                `/api/event/` +

                `${encodeURIComponent(currentSport)}/` +

                `${encodeURIComponent(eventId)}/markets`

            );


        let markets =
            Array.isArray(
                marketData.markets
            )
                ? [...marketData.markets]
                : [];


        /*
         * Market key 本身去重
         */

        markets =
            [...new Set(markets)];


        markets.sort(
            (a, b) => {

                const difference =

                    marketPriority(a) -

                    marketPriority(b);


                if (difference !== 0) {

                    return difference;

                }


                return a.localeCompare(b);

            }
        );


        if (!markets.length) {

            detail.innerHTML = `

                <div class="empty-state">

                    当前数据源没有返回这场比赛的详细盘口

                </div>

            `;

            return;

        }


        /*
         * server 当前最多取 28 个 market
         */

        const requestedMarkets =
            markets.slice(
                0,
                28
            );


        detail.innerHTML = `

            <div class="loading">

                <div class="loader"></div>

                找到
                ${markets.length}
                种盘口，正在读取赔率

            </div>

        `;


        /*
         * 2. 查询赔率
         */

        const oddsData =
            await apiRequest(

                `/api/event/` +

                `${encodeURIComponent(currentSport)}/` +

                `${encodeURIComponent(eventId)}/odds` +

                `?markets=` +

                encodeURIComponent(

                    requestedMarkets.join(",")

                )

            );


        const payload = {

            event:
                oddsData.event,

            availableMarkets:
                markets,

            requestedMarkets:

                oddsData.requestedMarkets ||

                requestedMarkets,

            quota:
                oddsData.quota

        };


        detailCache.set(

            eventId,

            payload

        );


        renderDetailedOdds(

            detail,

            payload

        );

    } catch (error) {

        console.error(
            "EVENT DETAIL:",
            error
        );


        detail.innerHTML = `

            <div class="error-state">

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }
}


/* ============================================================
   DEDUPLICATE MARKETS

   核心逻辑：

   同一个 market 下：

   description + name + point

   完全相同时，视为同一个选择。

   如果多个 bookmaker 都提供同一选择，
   只保留显示赔率最高的一个。

   不同 point 不会合并。

   例如：

   Over 1.5
   Over 2.5
   Over 3.5

   会全部保留。

============================================================ */

function buildMarketGroups(event) {

    const temporary =
        new Map();


    const bookmakers =
        Array.isArray(
            event?.bookmakers
        )
            ? event.bookmakers
            : [];


    bookmakers.forEach(
        bookmaker => {


            const markets =
                Array.isArray(
                    bookmaker.markets
                )
                    ? bookmaker.markets
                    : [];


            markets.forEach(
                market => {


                    if (!market?.key) {

                        return;

                    }


                    if (
                        !temporary.has(
                            market.key
                        )
                    ) {

                        temporary.set(

                            market.key,

                            new Map()

                        );

                    }


                    const outcomeMap =
                        temporary.get(
                            market.key
                        );


                    const outcomes =
                        Array.isArray(
                            market.outcomes
                        )
                            ? market.outcomes
                            : [];


                    outcomes.forEach(
                        outcome => {


                            const price =
                                Number(
                                    outcome.price
                                );


                            if (
                                !Number.isFinite(
                                    price
                                )
                            ) {

                                return;

                            }


                            const description =

                                String(

                                    outcome.description ||

                                    ""

                                ).trim();


                            const name =

                                String(

                                    outcome.name ||

                                    ""

                                ).trim();


                            const point =

                                outcome.point !== null &&

                                outcome.point !== undefined

                                    ? outcome.point

                                    : null;


                            /*
                             * 大小写也统一，
                             * 避免 "Over" / "over"
                             * 被当成两个选择。
                             */

                            const uniqueKey = [

                                description
                                    .toLowerCase(),

                                name
                                    .toLowerCase(),

                                point === null
                                    ? ""
                                    : String(point)

                            ].join("::");


                            const existing =
                                outcomeMap.get(
                                    uniqueKey
                                );


                            /*
                             * 没有 -> 加入
                             *
                             * 已存在 ->
                             * 只在当前赔率更高时覆盖
                             */

                            if (

                                !existing ||

                                price >
                                Number(
                                    existing.price
                                )

                            ) {

                                outcomeMap.set(

                                    uniqueKey,

                                    {

                                        description,

                                        name,

                                        point,

                                        price,

                                        bookmakerKey:

                                            bookmaker.key ||

                                            "",

                                        bookmakerTitle:

                                            bookmaker.title ||

                                            bookmaker.key ||

                                            "Bookmaker"

                                    }

                                );

                            }

                        }

                    );

                }

            );

        }

    );


    /*
     * Map<marketKey, Array<outcome>>
     */

    const result =
        new Map();


    temporary.forEach(

        (
            outcomeMap,
            marketKey
        ) => {


            const outcomes =

                [...outcomeMap.values()];


            /*
             * 排序
             */

            outcomes.sort(

                (a, b) => {


                    const aText =

                        `${a.description} ${a.name}`;


                    const bText =

                        `${b.description} ${b.name}`;


                    const textCompare =

                        aText.localeCompare(
                            bText
                        );


                    if (
                        textCompare !== 0
                    ) {

                        return textCompare;

                    }


                    const aPoint =

                        a.point === null
                            ? -99999
                            : Number(a.point);


                    const bPoint =

                        b.point === null
                            ? -99999
                            : Number(b.point);


                    return (
                        aPoint -
                        bPoint
                    );

                }

            );


            result.set(

                marketKey,

                outcomes

            );

        }

    );


    return result;
}


/* ============================================================
   RENDER DETAIL
============================================================ */

function renderDetailedOdds(
    container,
    payload
) {

    const event =
        payload?.event;


    if (!event) {

        container.innerHTML = `

            <div class="empty-state">

                没有收到比赛详情

            </div>

        `;

        return;
    }


    /*
     * 这里得到的已经是去重后的盘口
     */

    const groups =
        buildMarketGroups(
            event
        );


    let marketKeys =
        [...groups.keys()];


    marketKeys.sort(

        (a, b) => {


            const difference =

                marketPriority(a) -

                marketPriority(b);


            if (
                difference !== 0
            ) {

                return difference;

            }


            return a.localeCompare(b);

        }

    );


    if (!marketKeys.length) {

        container.innerHTML = `

            <div class="empty-state">

                数据源没有返回可显示的赔率

            </div>

        `;

        return;
    }


    let html = `

        <div class="detail-head">


            <div class="detail-head-left">


                <div class="detail-title">

                    ${escapeHtml(
                        event.home_team
                    )}

                    vs

                    ${escapeHtml(
                        event.away_team
                    )}

                </div>


                <div class="detail-meta">

                    ${escapeHtml(
                        formatDate(
                            event.commence_time
                        )
                    )}

                    ·

                    <span class="market-count">

                        ${marketKeys.length}
                        种盘口

                    </span>

                    · 重复盘口已合并

                </div>


            </div>


            <button

                class="close-btn"

                onclick="toggleEvent('${escapeJs(event.id)}')">

                收起

            </button>


        </div>

    `;


    /*
     * 顶部盘口导航
     */

    html += `

        <div class="market-nav">

            ${

                marketKeys.map(

                    key => `

                        <button

                            class="market-nav-btn"

                            onclick="

                                document

                                .getElementById(

                                    'market-${safeId(event.id)}-${safeId(key)}'

                                )

                                ?.scrollIntoView({

                                    behavior: 'smooth',

                                    block: 'center'

                                });

                            ">

                            ${escapeHtml(
                                marketName(key)
                            )}

                        </button>

                    `

                ).join("")

            }

        </div>

    `;


    /*
     * 每一个 market 只显示一次
     */

    marketKeys.forEach(
        key => {


            const outcomes =
                groups.get(key) || [];


            if (!outcomes.length) {

                return;

            }


            html += `

                <section

                    id="market-${safeId(event.id)}-${safeId(key)}"

                    class="market-section">


                    <div class="market-header">


                        <span>

                            ${escapeHtml(
                                marketName(key)
                            )}

                        </span>


                        <span class="market-count">

                            ${outcomes.length}
                            个选择

                        </span>


                    </div>


                    <div class="outcomes-container">


                        <div class="outcome-grid">

            `;


            outcomes.forEach(

                outcome => {


                    const price =
                        Number(
                            outcome.price
                        );


                    if (
                        !Number.isFinite(
                            price
                        )
                    ) {

                        return;

                    }


                    const description =

                        outcome.description ||

                        "";


                    const outcomeName =

                        outcome.name ||

                        "选择";


                    const point =

                        outcome.point !== null &&

                        outcome.point !== undefined

                            ? outcome.point

                            : null;


                    /*
                     * 如果有 description：
                     *
                     * Haaland · Over
                     *
                     * 如果没有：
                     *
                     * Arsenal
                     */

                    const selection =

                        description

                            ? `${description} · ${outcomeName}`

                            : outcomeName;


                    /*
                     * 注意：
                     *
                     * bookmaker 不再放进 ID。
                     *
                     * 因为相同盘口现在已经合并。
                     */

                    const pickId = [

                        event.id,

                        key,

                        description
                            .toLowerCase(),

                        outcomeName
                            .toLowerCase(),

                        point === null
                            ? ""
                            : point

                    ].join("::");


                    const pick = {

                        id:
                            pickId,

                        eventId:
                            event.id,

                        event:

                            `${event.home_team} vs ${event.away_team}`,

                        marketKey:
                            key,

                        market:
                            marketName(key),

                        bookmaker:
                            outcome.bookmakerTitle,

                        selection,

                        point,

                        price

                    };


                    const selected =

                        picks.some(

                            existing =>

                                existing.id ===
                                pickId

                        );


                    const encodedPick =

                        encodeURIComponent(

                            JSON.stringify(
                                pick
                            )

                        );


                    html += `

                        <button

                            class="odd-btn ${selected ? "selected" : ""}"

                            onclick="addPickFromEncoded('${encodedPick}')">


                            <div class="odd-name">

                                ${escapeHtml(
                                    selection
                                )}

                            </div>


                            <div class="odd-row">


                                <span class="odd-point">

                                    ${
                                        point !== null

                                            ? escapeHtml(
                                                String(point)
                                            )

                                            : ""
                                    }

                                </span>


                                <span class="odd-price">

                                    ${price.toFixed(2)}

                                </span>


                            </div>


                            <div class="odd-source">

                                ${escapeHtml(
                                    outcome.bookmakerTitle
                                )}

                            </div>


                        </button>

                    `;

                }

            );


            html += `

                        </div>

                    </div>

                </section>

            `;

        }

    );


    container.innerHTML =
        html;
}


/* ============================================================
   PICKS
============================================================ */

function addPickFromEncoded(
    encoded
) {

    let pick;


    try {

        pick =
            JSON.parse(

                decodeURIComponent(
                    encoded
                )

            );

    } catch (error) {

        console.error(
            "PICK:",
            error
        );

        return;

    }


    /*
     * 点击已经选择的项目
     * = 取消
     */

    const existingIndex =

        picks.findIndex(

            item =>

                item.id ===
                pick.id

        );


    if (
        existingIndex !== -1
    ) {

        picks.splice(

            existingIndex,

            1

        );


        savePicks();

        renderPicks();

        refreshOpenDetail();

        return;
    }


    /*
     * 同一场 + 同一种 market
     * 只允许一个选择进入串关。
     */

    picks =
        picks.filter(

            item =>

                !(
                    item.eventId ===
                        pick.eventId &&

                    item.marketKey ===
                        pick.marketKey
                )

        );


    picks.push(
        pick
    );


    savePicks();

    renderPicks();

    refreshOpenDetail();
}


function removePick(id) {

    picks =
        picks.filter(

            pick =>

                pick.id !==
                id

        );


    savePicks();

    renderPicks();

    refreshOpenDetail();
}


function clearPicks() {

    picks = [];


    savePicks();

    renderPicks();

    refreshOpenDetail();
}


function savePicks() {

    localStorage.setItem(

        "sportsPlusPicks",

        JSON.stringify(
            picks
        )

    );
}


function refreshOpenDetail() {

    if (!openedEventId) {

        return;

    }


    const payload =
        detailCache.get(
            openedEventId
        );


    const detail =
        document.getElementById(

            `event-detail-${openedEventId}`

        );


    if (
        payload &&
        detail
    ) {

        renderDetailedOdds(

            detail,

            payload

        );

    }
}


/* ============================================================
   BET SLIP
============================================================ */

function renderPicks() {

    const container =
        document.getElementById(
            "picksContainer"
        );


    if (!picks.length) {

        container.innerHTML = `

            <div class="pick-empty">

                点击任意赔率加入模拟串关

            </div>

        `;

    } else {

        container.innerHTML =

            picks.map(

                pick => `

                    <div class="pick">


                        <div class="pick-top">


                            <div class="pick-market">

                                ${escapeHtml(
                                    pick.market
                                )}

                            </div>


                            <button

                                class="pick-remove"

                                onclick='removePick(${JSON.stringify(pick.id)})'>

                                ×

                            </button>


                        </div>


                        <div class="pick-selection">

                            ${escapeHtml(
                                pick.selection
                            )}

                            ${
                                pick.point !== null &&
                                pick.point !== undefined

                                    ? ` ${escapeHtml(String(pick.point))}`

                                    : ""
                            }

                        </div>


                        <div class="pick-event">

                            ${escapeHtml(
                                pick.event
                            )}

                        </div>


                        <div class="pick-price">

                            ${Number(
                                pick.price
                            ).toFixed(2)}

                        </div>


                    </div>

                `

            ).join("");

    }


    calculateSummary();
}


/* ============================================================
   PARLAY CALCULATOR
============================================================ */

function calculateSummary() {

    const stake =

        Math.max(

            0,

            Number(

                document.getElementById(
                    "stakeInput"
                ).value

            ) || 0

        );


    let totalOdds =
        1;


    picks.forEach(
        pick => {


            const price =
                Number(
                    pick.price
                );


            if (

                Number.isFinite(
                    price
                ) &&

                price > 0

            ) {

                totalOdds *=
                    price;

            }

        }

    );


    const returnAmount =

        picks.length

            ? stake *
              totalOdds

            : 0;


    const profit =

        picks.length

            ? returnAmount -
              stake

            : 0;


    document.getElementById(
        "summary"
    ).innerHTML = `


        <div class="summary-row">

            <span>
                选择数量
            </span>

            <span class="summary-value">

                ${picks.length}

            </span>

        </div>


        <div class="summary-row">

            <span>
                总赔率
            </span>

            <span class="summary-value green">

                ${
                    picks.length

                        ? totalOdds.toFixed(2)

                        : "—"
                }

            </span>

        </div>


        <div class="summary-row">

            <span>
                模拟金额
            </span>

            <span class="summary-value">

                $${stake.toFixed(2)}

            </span>

        </div>


        <div class="summary-row">

            <span>
                模拟返还
            </span>

            <span class="summary-value green">

                ${
                    picks.length

                        ? "$" +
                          returnAmount.toFixed(2)

                        : "—"
                }

            </span>

        </div>


        <div class="summary-row">

            <span>
                模拟盈利
            </span>

            <span class="summary-value green">

                ${
                    picks.length

                        ? "$" +
                          profit.toFixed(2)

                        : "—"
                }

            </span>

        </div>

    `;
}

   LEAGUE BUTTONS
============================================================ */

document

    .querySelectorAll(
        ".league"
    )

    .forEach(
        button => {


            button.addEventListener(

                "click",

                () => {


                    document

                        .querySelectorAll(
                            ".league"
                        )

                        .forEach(
                            item =>

                                item.classList.remove(
                                    "active"
                                )

                        );


                    button.classList.add(
                        "active"
                    );


                    currentSport =

                        button.dataset.sport;


                    currentLeagueName =

                        button.dataset.name ||

                        button.textContent.trim();


                    document.getElementById(
                        "leagueTitle"
                    ).textContent =

                        currentLeagueName;


                    document.getElementById(
                        "searchInput"
                    ).value =
                        "";


                    /*
                     * 切换联赛时清掉比赛详情缓存
                     */

                    detailCache.clear();


                    loadEvents();

                }

            );

        }

    );


/* ============================================================
   UI EVENTS
============================================================ */

document.getElementById(
    "searchInput"
)
.addEventListener(

    "input",

);


document.getElementById(

)
.addEventListener(

    "click",

    () => {

        loadEvents();

    }

);

)
.addEventListener(

)
.addEventListener(

);

renderPicks();

checkStatus();

</script>
