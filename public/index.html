<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SPORTS+ 体育模拟中心</title>

<style>
:root{
    --bg:#070b10;
    --panel:#101720;
    --panel2:#17212d;
    --panel3:#1c2937;
    --border:#263545;
    --text:#f3f6f9;
    --muted:#8d9aa8;
    --green:#48e17c;
    --greenDark:#153d25;
    --red:#ff6d75;
    --yellow:#f0c65b;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;
}

/* HEADER */

header{
    height:66px;
    padding:0 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:#0c131b;
    border-bottom:1px solid var(--border);

    position:sticky;
    top:0;
    z-index:50;
}

.logo{
    font-size:22px;
    font-weight:900;
    letter-spacing:.3px;
}

.logo span{
    color:var(--green);
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.status{
    color:var(--muted);
    font-size:12px;
}

.dot{
    width:8px;
    height:8px;
    display:inline-block;
    border-radius:50%;
    background:var(--green);
    margin-right:5px;
}

.refresh{
    border:0;
    background:var(--green);
    color:#061009;
    font-weight:800;
    padding:8px 13px;
    border-radius:7px;
    cursor:pointer;
}

/* LAYOUT */

.layout{
    max-width:1550px;
    margin:auto;
    padding:14px;

    display:grid;
    grid-template-columns:190px minmax(0,1fr) 360px;
    gap:14px;
}

/* SIDEBAR */

.sidebar{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:11px;
    padding:10px;

    height:max-content;

    position:sticky;
    top:80px;
}

.side-title{
    color:var(--muted);
    font-size:11px;
    padding:7px 9px;
    text-transform:uppercase;
}

.sport{
    padding:11px 10px;
    border-radius:8px;
    margin:2px 0;
    cursor:pointer;
    transition:.15s;
}

.sport:hover{
    background:var(--panel2);
}

.sport.active{
    background:var(--greenDark);
    color:var(--green);
    font-weight:800;
}

/* CONTENT */

.controls{
    display:flex;
    gap:7px;
    margin-bottom:12px;
    flex-wrap:wrap;
}

.filter{
    background:var(--panel);
    border:1px solid var(--border);
    color:#dce2e8;
    border-radius:20px;
    padding:9px 15px;
    cursor:pointer;
}

.filter.active{
    background:var(--green);
    color:#07110a;
    border-color:var(--green);
    font-weight:800;
}

.search{
    flex:1;
    min-width:180px;
    background:var(--panel);
    color:white;
    border:1px solid var(--border);
    border-radius:20px;
    padding:9px 15px;
    outline:none;
}

.search:focus{
    border-color:var(--green);
}

.info-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;

    color:var(--muted);
    font-size:12px;

    margin:0 4px 10px;
}

/* EVENT */

.game{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:9px;
    overflow:hidden;
}

.game-head{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:14px;

    cursor:pointer;
}

.game-head:hover{
    background:#131d27;
}

.game-time{
    color:var(--muted);
    font-size:11px;
    margin-bottom:6px;
}

.team{
    font-weight:700;
    line-height:1.65;
}

.expand{
    color:var(--green);
    font-size:12px;
    white-space:nowrap;
}

/* MARKETS */

.markets{
    border-top:1px solid var(--border);
    padding:13px;
}

.market{
    margin-bottom:18px;
}

.market:last-child{
    margin-bottom:0;
}

.market-title{
    color:#9ba8b5;
    font-size:12px;
    margin-bottom:7px;
    display:flex;
    justify-content:space-between;
}

.odds{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(115px,1fr));
    gap:7px;
}

.odd{
    min-width:0;

    background:#1a2633;
    border:1px solid #334457;
    border-radius:7px;

    padding:10px 9px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;

    cursor:pointer;
}

.odd:hover{
    border-color:var(--green);
}

.odd.selected{
    background:var(--greenDark);
    border-color:var(--green);
}

.odd-label{
    font-size:12px;
    color:#c7cfd7;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.odd-price{
    color:var(--green);
    font-weight:900;
    font-size:14px;
}

/* BETSLIP */

.betslip{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:11px;
    padding:15px;

    position:sticky;
    top:80px;
    height:max-content;
}

.slip-title{
    font-size:18px;
    font-weight:900;
}

.slip-subtitle{
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
    margin-bottom:12px;
}

.empty{
    color:#758393;
    text-align:center;
    padding:45px 10px;
    line-height:1.8;
}

.pick{
    padding:11px 0;
    border-bottom:1px solid var(--border);
}

.pick-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.pick-name{
    font-weight:800;
    font-size:14px;
}

.pick-event,
.pick-market{
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}

.pick-price{
    color:var(--green);
    font-weight:900;
    margin-top:6px;
}

.remove{
    background:none;
    border:0;
    color:var(--red);
    font-size:19px;
    cursor:pointer;
}

.summary{
    margin-top:15px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:10px 0;
}

.total{
    color:var(--green);
    font-size:22px;
    font-weight:900;
}

.stake-label{
    color:var(--muted);
    font-size:11px;
    margin:14px 0 6px;
}

.stake{
    width:100%;
    background:#080d13;
    border:1px solid var(--border);
    border-radius:8px;
    color:white;
    padding:12px;
    font-size:17px;
    outline:none;
}

.stake:focus{
    border-color:var(--green);
}

.return{
    color:var(--green);
    font-size:20px;
    font-weight:900;
}

.clear{
    width:100%;
    margin-top:12px;
    padding:10px;

    background:var(--panel2);
    border:1px solid var(--border);
    color:white;

    border-radius:7px;
    cursor:pointer;
}

/* MESSAGES */

.message{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;

    padding:50px 20px;
    text-align:center;

    color:var(--muted);
}

.error{
    color:#ff9298;
}

.error-box{
    max-width:700px;
    margin:auto;
    text-align:left;

    background:#24151a;
    border:1px solid #5b2b35;
    border-radius:8px;

    padding:14px;

    color:#ffadb1;

    font-size:12px;
    line-height:1.6;

    word-break:break-word;
}

.retry{
    margin-top:15px;
    border:0;
    background:var(--green);
    color:#07110a;
    font-weight:800;
    padding:9px 15px;
    border-radius:7px;
    cursor:pointer;
}

.badge{
    background:#202d3b;
    color:#9fabb7;
    padding:3px 7px;
    border-radius:5px;
    font-size:10px;
}

/* MOBILE */

@media(max-width:1050px){

    .layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        position:relative;
        top:0;

        display:flex;
        overflow:auto;
        gap:4px;
    }

    .side-title{
        display:none;
    }

    .sport{
        white-space:nowrap;
    }

    .betslip{
        position:relative;
        top:0;
    }
}

@media(max-width:600px){

    header{
        padding:0 12px;
    }

    .logo{
        font-size:18px;
    }

    .status{
        display:none;
    }

    .layout{
        padding:8px;
    }

    .odds{
        grid-template-columns:repeat(2,1fr);
    }
}

</style>
</head>

<body>

<header>

    <div class="logo">
        SPORTS<span>+</span>
    </div>

    <div class="header-right">

        <div class="status">
            <span class="dot"></span>
            <span id="statusText">准备加载</span>
        </div>

        <button
            class="refresh"
            onclick="loadOdds()">
            刷新
        </button>

    </div>

</header>


<div class="layout">

    <!-- 左侧体育项目 -->

    <aside class="sidebar">

        <div class="side-title">
            体育项目
        </div>

        <div class="sport active"
             data-sport="soccer_epl">
            ⚽ 英超
        </div>

        <div class="sport"
             data-sport="soccer_spain_la_liga">
            ⚽ 西甲
        </div>

        <div class="sport"
             data-sport="soccer_germany_bundesliga">
            ⚽ 德甲
        </div>

        <div class="sport"
             data-sport="soccer_italy_serie_a">
            ⚽ 意甲
        </div>

        <div class="sport"
             data-sport="soccer_france_ligue_one">
            ⚽ 法甲
        </div>

        <div class="sport"
             data-sport="soccer_usa_mls">
            ⚽ MLS
        </div>

        <div class="sport"
             data-sport="basketball_nba">
            🏀 NBA
        </div>

        <div class="sport"
             data-sport="icehockey_nhl">
            🏒 NHL
        </div>

    </aside>


    <!-- 中间赛事 -->

    <main>

        <div class="controls">

            <button
                class="filter active"
                data-filter="all">
                全部
            </button>

            <button
                class="filter"
                data-filter="today">
                今日
            </button>

            <button
                class="filter"
                data-filter="tomorrow">
                明日
            </button>

            <input
                id="search"
                class="search"
                placeholder="搜索球队"
                oninput="renderEvents()">

        </div>

        <div class="info-bar">

            <span id="eventCount">
                0 场比赛
            </span>

            <span id="lastUpdate">
            </span>

        </div>

        <div id="events">

            <div class="message">
                正在加载比赛...
            </div>

        </div>

    </main>


    <!-- 右侧串关 -->

    <aside class="betslip">

        <div class="slip-title">
            我的串关
        </div>

        <div
            class="slip-subtitle"
            id="betCount">
            0 个选择
        </div>

        <div id="slip"></div>

    </aside>

</div>


<script>

/* ==============================
   STATE
============================== */

let currentSport = "soccer_epl";
let currentFilter = "all";

let events = [];
let picks = [];

const expanded = new Set();


/* ==============================
   MARKET 中文
============================== */

const marketNames = {

    h2h:
        "全场赛果",

    spreads:
        "让球 / 让分",

    totals:
        "总进球 / 总分",

    btts:
        "双方进球",

    draw_no_bet:
        "平局退款",

    alternate_spreads:
        "其他让球",

    alternate_totals:
        "其他大小",

    team_totals:
        "球队总进球 / 总分",

    h2h_h1:
        "上半场赛果",

    totals_h1:
        "上半场大小",

    player_points:
        "球员得分",

    player_rebounds:
        "球员篮板",

    player_assists:
        "球员助攻",

    player_threes:
        "球员三分"

};


function marketName(key){

    return marketNames[key] || key;

}


/* ==============================
   API
============================== */

async function apiRequest(url){

    const response = await fetch(
        url,
        {
            cache:"no-store"
        }
    );

    /*
       非常重要：

       不直接 response.json()

       Render 如果返回：
       502 HTML
       Not Found
       Bad Gateway

       页面也不会炸。
    */

    const raw =
        await response.text();


    let data = null;


    try{

        data =
            raw
            ? JSON.parse(raw)
            : {};

    }

    catch{

        const preview =
            raw
            .replace(/\s+/g," ")
            .substring(0,300);


        throw new Error(
            `服务器返回非 JSON 内容。HTTP ${response.status}：${preview}`
        );

    }


    if(!response.ok){

        throw new Error(

            data.error
            ||
            data.message
            ||
            `服务器错误 HTTP ${response.status}`

        );

    }


    return data;

}


/* ==============================
   LOAD
============================== */

async function loadOdds(){

    const box =
        document.getElementById(
            "events"
        );


    box.innerHTML = `
        <div class="message">
            正在获取最新比赛和赔率...
        </div>
    `;


    document.getElementById(
        "statusText"
    ).innerText =
        "正在更新";


    try{

        const data =
            await apiRequest(
                `/api/odds/${encodeURIComponent(currentSport)}`
            );


        events =
            Array.isArray(data.events)
            ? data.events
            : [];


        document.getElementById(
            "statusText"
        ).innerText =
            "数据正常";


        const updateDate =
            data.updated
            ? new Date(data.updated)
            : new Date();


        document.getElementById(
            "lastUpdate"
        ).innerText =
            "更新 "
            +
            updateDate.toLocaleTimeString(
                "zh-CN",
                {
                    hour:"2-digit",
                    minute:"2-digit",
                    second:"2-digit"
                }
            );


        renderEvents();

    }

    catch(error){

        console.error(error);


        document.getElementById(
            "statusText"
        ).innerText =
            "连接异常";


        document.getElementById(
            "eventCount"
        ).innerText =
            "加载失败";


        box.innerHTML = `

            <div class="message">

                <div
                    style="
                    font-size:18px;
                    font-weight:800;
                    margin-bottom:14px;
                    "
                    class="error">

                    无法加载比赛

                </div>


                <div class="error-box">

                    ${escapeHTML(
                        error.message
                    )}

                </div>


                <button
                    class="retry"
                    onclick="loadOdds()">

                    重新尝试

                </button>

            </div>

        `;

    }

}


/* ==============================
   EVENTS
============================== */

function renderEvents(){

    const box =
        document.getElementById(
            "events"
        );


    const search =
        document.getElementById(
            "search"
        )
        .value
        .trim()
        .toLowerCase();


    const today =
        new Date();


    const tomorrow =
        new Date();

    tomorrow.setDate(
        tomorrow.getDate()+1
    );


    const filtered =
        events.filter(event=>{

            const teams =
                `${event.home_team || ""}
                 ${event.away_team || ""}`
                .toLowerCase();


            if(
                search &&
                !teams.includes(search)
            ){
                return false;
            }


            const gameDate =
                new Date(
                    event.commence_time
                );


            if(
                currentFilter ===
                "today"
            ){

                return sameDay(
                    gameDate,
                    today
                );

            }


            if(
                currentFilter ===
                "tomorrow"
            ){

                return sameDay(
                    gameDate,
                    tomorrow
                );

            }


            return true;

        });


    document.getElementById(
        "eventCount"
    ).innerText =
        `${filtered.length} 场比赛`;


    if(filtered.length===0){

        box.innerHTML = `

            <div class="message">

                当前分类没有可显示的比赛。

            </div>

        `;

        return;

    }


    box.innerHTML = "";


    filtered.forEach(event=>{

        const markets =
            getMarkets(event);


        const open =
            expanded.has(
                event.id
            );


        const card =
            document.createElement(
                "section"
            );


        card.className =
            "game";


        card.innerHTML = `

            <div
                class="game-head"
                onclick="toggleEvent('${escapeJS(event.id)}')">

                <div>

                    <div class="game-time">

                        ${formatDate(
                            event.commence_time
                        )}

                    </div>


                    <div class="team">

                        ${escapeHTML(
                            event.home_team
                            || "主队"
                        )}

                    </div>


                    <div class="team">

                        ${escapeHTML(
                            event.away_team
                            || "客队"
                        )}

                    </div>

                </div>


                <div class="expand">

                    ${
                        open
                        ? "收起 ▲"
                        : `${markets.length} 个盘口 ▼`
                    }

                </div>

            </div>


            ${
                open
                ? renderMarkets(
                    event,
                    markets
                )
                : ""
            }

        `;


        box.appendChild(card);

    });

}


/* ==============================
   BOOKMAKER / MARKETS
============================== */

function getMarkets(event){

    if(
        !Array.isArray(
            event.bookmakers
        )
        ||
        event.bookmakers.length===0
    ){

        return [];

    }


    /*
       当前使用 API 返回的第一家 bookmaker。

       后面如果要固定某一家 sportsbook，
       可以在这里修改。
    */

    const bookmaker =
        event.bookmakers[0];


    return Array.isArray(
        bookmaker.markets
    )
        ? bookmaker.markets
        : [];

}


function renderMarkets(
    event,
    markets
){

    if(markets.length===0){

        return `

            <div class="markets">

                <div class="message"
                     style="padding:20px">

                    当前比赛暂时没有可用盘口。

                </div>

            </div>

        `;

    }


    let html =
        `<div class="markets">`;


    markets.forEach(market=>{

        const outcomes =
            Array.isArray(
                market.outcomes
            )
            ? market.outcomes
            : [];


        if(outcomes.length===0)
            return;


        html += `

            <div class="market">

                <div class="market-title">

                    <span>
                        ${escapeHTML(
                            marketName(
                                market.key
                            )
                        )}
                    </span>

                    <span class="badge">
                        ${outcomes.length}
                    </span>

                </div>

                <div class="odds">

        `;


        outcomes.forEach(
            outcome=>{

            const price =
                Number(
                    outcome.price
                );


            if(
                !Number.isFinite(price)
            ){
                return;
            }


            const id =
                makePickId(
                    event,
                    market,
                    outcome
                );


            const selected =
                picks.some(
                    p=>p.id===id
                );


            const pickData = {

                id,

                eventId:
                    event.id,

                home:
                    event.home_team,

                away:
                    event.away_team,

                market:
                    market.key,

                outcome:
                    outcome.name,

                point:
                    outcome.point
                    ?? null,

                price

            };


            html += `

                <div
                    class="odd
                    ${selected
                    ? "selected"
                    : ""}"

                    data-pick='${escapeAttribute(
                        JSON.stringify(
                            pickData
                        )
                    )}'

                    onclick="selectFromElement(this)">

                    <span class="odd-label">

                        ${escapeHTML(
                            formatOutcome(
                                outcome
                            )
                        )}

                    </span>

                    <span class="odd-price">

                        ${price.toFixed(2)}

                    </span>

                </div>

            `;

        });


        html += `

                </div>

            </div>

        `;

    });


    html += `</div>`;


    return html;

}


/* ==============================
   PICKS
============================== */

function selectFromElement(el){

    try{

        const pick =
            JSON.parse(
                el.dataset.pick
            );


        togglePick(pick);

    }

    catch(error){

        console.error(
            "无法读取 selection",
            error
        );

    }

}


function togglePick(pick){

    const exact =
        picks.findIndex(
            p=>p.id===pick.id
        );


    if(exact>=0){

        picks.splice(
            exact,
            1
        );

    }

    else{

        /*
          同一场同一盘口只保留一个 selection。
        */

        picks =
            picks.filter(
                p=>!(
                    p.eventId ===
                    pick.eventId
                    &&
                    p.market ===
                    pick.market
                )
            );


        picks.push(pick);

    }


    renderEvents();
    renderSlip();

}


function removePick(index){

    picks.splice(
        index,
        1
    );

    renderEvents();
    renderSlip();

}


function clearSlip(){

    picks=[];

    renderEvents();
    renderSlip();

}


/* ==============================
   BET SLIP
============================== */

function renderSlip(){

    const box =
        document.getElementById(
            "slip"
        );


    document.getElementById(
        "betCount"
    ).innerText =
        `${picks.length} 个选择`;


    if(picks.length===0){

        box.innerHTML = `

            <div class="empty">

                点击比赛中的赔率

                <br>

                创建你的模拟串关

            </div>

        `;

        return;

    }


    let total = 1;
    let html = "";


    picks.forEach(
        (pick,index)=>{

        total *=
            Number(
                pick.price
            );


        html += `

            <div class="pick">

                <div class="pick-row">

                    <div>

                        <div class="pick-name">

                            ${escapeHTML(
                                formatPickOutcome(
                                    pick
                                )
                            )}

                        </div>


                        <div class="pick-event">

                            ${escapeHTML(
                                pick.home
                            )}

                            vs

                            ${escapeHTML(
                                pick.away
                            )}

                        </div>


                        <div class="pick-market">

                            ${escapeHTML(
                                marketName(
                                    pick.market
                                )
                            )}

                        </div>


                        <div class="pick-price">

                            ${Number(
                                pick.price
                            ).toFixed(2)}

                        </div>

                    </div>


                    <button
                        class="remove"
                        onclick="removePick(${index})">

                        ×

                    </button>

                </div>

            </div>

        `;

    });


    html += `

        <div class="summary">

            <div class="summary-row">

                <span>
                    串关类型
                </span>

                <strong>
                    ${picks.length} 串 1
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    总赔率
                </span>

                <span
                    class="total"
                    id="totalOdds">

                    ${total.toFixed(2)}

                </span>

            </div>


            <div class="stake-label">
                模拟投注金额（CAD）
            </div>


            <input
                id="stake"
                class="stake"
                type="number"
                min="0"
                step="10"
                value="100"
                oninput="calculateReturn()">


            <div class="summary-row">

                <span>
                    模拟返还
                </span>

                <span
                    class="return"
                    id="returnAmount">

                    $${(
                        total*100
                    ).toFixed(2)}

                </span>

            </div>


            <div class="summary-row">

                <span>
                    模拟利润
                </span>

                <strong
                    id="profitAmount">

                    $${(
                        total*100
                        -
                        100
                    ).toFixed(2)}

                </strong>

            </div>


            <button
                class="clear"
                onclick="clearSlip()">

                清空投注单

            </button>

        </div>

    `;


    box.innerHTML = html;

}


function calculateReturn(){

    let total=1;


    picks.forEach(p=>{

        total *=
            Number(p.price);

    });


    const stake =
        Number(
            document.getElementById(
                "stake"
            )?.value
        ) || 0;


    const returnEl =
        document.getElementById(
            "returnAmount"
        );


    const profitEl =
        document.getElementById(
            "profitAmount"
        );


    if(returnEl){

        returnEl.innerText =
            "$"
            +
            (
                stake*total
            ).toFixed(2);

    }


    if(profitEl){

        profitEl.innerText =
            "$"
            +
            (
                stake*total
                -
                stake
            ).toFixed(2);

    }

}


/* ==============================
   HELPERS
============================== */

function toggleEvent(id){

    if(expanded.has(id)){

        expanded.delete(id);

    }

    else{

        expanded.add(id);

    }


    renderEvents();

}


function makePickId(
    event,
    market,
    outcome
){

    return [

        event.id,

        market.key,

        outcome.name,

        outcome.point ?? ""

    ].join("|");

}


function formatOutcome(outcome){

    let name =
        translateOutcome(
            outcome.name
        );


    if(
        outcome.point !== null
        &&
        outcome.point !== undefined
    ){

        const point =
            Number(
                outcome.point
            );


        name +=
            " "
            +
            (
                point>0
                ? "+"
                : ""
            )
            +
            point;

    }


    return name;

}


function formatPickOutcome(pick){

    let name =
        translateOutcome(
            pick.outcome
        );


    if(
        pick.point !== null
        &&
        pick.point !== undefined
    ){

        const point =
            Number(
                pick.point
            );


        name +=
            " "
            +
            (
                point>0
                ? "+"
                : ""
            )
            +
            point;

    }


    return name;

}


function translateOutcome(name){

    const translations = {

        Draw:
            "平局",

        Over:
            "大",

        Under:
            "小",

        Yes:
            "是",

        No:
            "否"

    };


    return translations[name]
        || name;

}


function formatDate(value){

    const d =
        new Date(value);


    if(
        Number.isNaN(
            d.getTime()
        )
    ){

        return "时间待定";

    }


    return d.toLocaleString(
        "zh-CN",
        {
            month:"numeric",
            day:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function sameDay(a,b){

    return (
        a.getFullYear()
        ===
        b.getFullYear()
        &&
        a.getMonth()
        ===
        b.getMonth()
        &&
        a.getDate()
        ===
        b.getDate()
    );

}


function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


function escapeAttribute(value){

    return escapeHTML(value);

}


function escapeJS(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "\\",
        "\\\\"
    )
    .replaceAll(
        "'",
        "\\'"
    );

}
