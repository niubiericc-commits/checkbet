<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPORTS+</title>

<style>
:root{
    --bg:#070b11;
    --bg2:#0b111a;
    --panel:#101824;
    --panel2:#151f2e;
    --panel3:#1b2839;
    --border:#26364b;
    --text:#f4f7fb;
    --muted:#8e9bae;
    --green:#52e58a;
    --red:#ff6b6b;
}

*{box-sizing:border-box}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input{font:inherit}
button{cursor:pointer}

header{
    height:64px;
    display:flex;
    align-items:center;
    padding:0 22px;
    background:#0a0f17;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:23px;
    font-weight:900;
}

.logo span{color:var(--green)}

.header-info{
    margin-left:28px;
    color:var(--muted);
    font-size:12px;
}

#serverStatus{
    margin-left:auto;
    color:var(--muted);
    font-size:12px;
}

#serverStatus.ok{color:var(--green)}
#serverStatus.error{color:var(--red)}

.layout{
    display:grid;
    grid-template-columns:220px minmax(0,1fr) 330px;
    min-height:calc(100vh - 64px);
}

.sidebar{
    background:var(--bg2);
    border-right:1px solid var(--border);
    padding:14px 10px;
}

.sidebar-title{
    color:var(--muted);
    font-size:11px;
    padding:9px 11px;
}

.league{
    display:block;
    width:100%;
    border:0;
    border-radius:8px;
    background:transparent;
    color:#dce4ee;
    padding:11px 12px;
    margin-bottom:3px;
    text-align:left;
}

.league:hover{background:var(--panel2)}

.league.active{
    background:var(--panel3);
    color:var(--green);
    font-weight:800;
}

main{
    min-width:0;
    padding:18px;
}

.toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
}

#leagueTitle{
    font-size:20px;
    font-weight:900;
    white-space:nowrap;
}

#searchInput{
    flex:1;
    min-width:0;
    background:var(--panel);
    border:1px solid var(--border);
    color:white;
    border-radius:9px;
    padding:11px 13px;
    outline:none;
}

#searchInput:focus{border-color:var(--green)}

#refreshBtn{
    border:1px solid var(--border);
    background:var(--panel2);
    color:white;
    border-radius:9px;
    padding:11px 15px;
}

.info{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.pill{
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--muted);
    padding:7px 10px;
    border-radius:20px;
    font-size:11px;
}

.event{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:11px;
    margin-bottom:10px;
    overflow:hidden;
}

.event-head{
    display:grid;
    grid-template-columns:110px minmax(0,1fr) auto;
    gap:13px;
    align-items:center;
    padding:15px;
    cursor:pointer;
}

.event-head:hover{background:var(--panel2)}

.time{
    color:var(--muted);
    font-size:12px;
}

.team{
    font-weight:750;
    margin:3px 0;
}

.open-text{
    color:var(--green);
    font-size:12px;
}

.detail{
    display:none;
    padding:15px;
    border-top:1px solid var(--border);
    background:#0e1621;
}

.event.open .detail{display:block}

.detail-title{
    font-size:17px;
    font-weight:900;
    margin-bottom:5px;
}

.detail-sub{
    color:var(--muted);
    font-size:11px;
    margin-bottom:13px;
}

.market-nav{
    display:flex;
    gap:6px;
    overflow-x:auto;
    margin-bottom:12px;
    padding-bottom:5px;
}

.market-nav button{
    flex:0 0 auto;
    border:1px solid var(--border);
    background:var(--panel2);
    color:#dce4ee;
    border-radius:7px;
    padding:7px 10px;
    font-size:11px;
}

.market{
    border:1px solid var(--border);
    border-radius:9px;
    overflow:hidden;
    margin-bottom:11px;
}

.market-title{
    display:flex;
    justify-content:space-between;
    padding:11px 12px;
    background:var(--panel2);
    font-size:13px;
    font-weight:800;
}

.market-count{
    color:var(--green);
    font-size:11px;
    font-weight:500;
}

.odds{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
    gap:7px;
    padding:10px;
}

.odd{
    border:1px solid var(--border);
    background:var(--panel2);
    color:white;
    border-radius:8px;
    padding:10px;
    text-align:left;
}

.odd:hover,
.odd.selected{
    border-color:var(--green);
}

.odd.selected{
    background:rgba(82,229,138,.11);
}

.odd-name{
    font-size:11px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.odd-bottom{
    display:flex;
    justify-content:space-between;
    gap:8px;
    margin-top:7px;
}

.point{
    color:var(--muted);
    font-size:11px;
}

.price{
    color:var(--green);
    font-weight:900;
}

.source{
    margin-top:5px;
    font-size:9px;
    color:#657489;
}

.loading,.error,.empty{
    padding:30px 15px;
    text-align:center;
    color:var(--muted);
}

.error{color:var(--red)}

.betslip{
    background:var(--bg2);
    border-left:1px solid var(--border);
    padding:16px;
}

.bet-title{
    display:flex;
    justify-content:space-between;
    font-size:18px;
    font-weight:900;
    margin-bottom:13px;
}

#clearBtn{
    background:none;
    border:0;
    color:var(--red);
    font-size:11px;
}

.pick{
    padding:11px 0;
    border-bottom:1px solid var(--border);
}

.pick-market{
    color:var(--muted);
    font-size:10px;
}

.pick-name{
    font-size:13px;
    font-weight:800;
    margin-top:4px;
}

.pick-event{
    color:var(--muted);
    font-size:10px;
    margin-top:5px;
}

.pick-price{
    color:var(--green);
    font-weight:900;
    margin-top:5px;
}

.remove{
    float:right;
    border:0;
    background:none;
    color:var(--red);
}

#stake{
    width:100%;
    margin-top:14px;
    background:var(--panel);
    border:1px solid var(--border);
    color:white;
    border-radius:8px;
    padding:11px;
}

.summary{
    margin-top:12px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:9px;
    padding:12px;
}

.row{
    display:flex;
    justify-content:space-between;
    margin:8px 0;
    font-size:12px;
}

.row span:first-child{color:var(--muted)}
.green{color:var(--green);font-weight:800}

.note{
    margin-top:13px;
    color:var(--muted);
    font-size:10px;
    line-height:1.5;
}

@media(max-width:1050px){
    .layout{grid-template-columns:190px minmax(0,1fr)}
    .betslip{display:none}
}

@media(max-width:700px){
    .layout{display:block}

    .sidebar{
        display:flex;
        overflow:auto;
        border-right:0;
        border-bottom:1px solid var(--border);
    }

    .sidebar-title{display:none}

    .league{
        width:auto;
        white-space:nowrap;
    }

    main{padding:11px}

    #leagueTitle{display:none}

    .event-head{
        grid-template-columns:80px 1fr;
    }

    .open-text{grid-column:2}

    .odds{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">SPORTS<span>+</span></div>
    <div class="header-info">详细盘口 · 模拟串关</div>
    <div id="serverStatus">连接中</div>
</header>

<div class="layout">

<aside class="sidebar">

    <div class="sidebar-title">足球联赛</div>

    <button class="league active"
        data-sport="soccer_epl"
        data-name="英格兰超级联赛">英超</button>

    <button class="league"
        data-sport="soccer_spain_la_liga"
        data-name="西班牙甲级联赛">西甲</button>

    <button class="league"
        data-sport="soccer_germany_bundesliga"
        data-name="德国甲级联赛">德甲</button>

    <button class="league"
        data-sport="soccer_italy_serie_a"
        data-name="意大利甲级联赛">意甲</button>

    <button class="league"
        data-sport="soccer_france_ligue_one"
        data-name="法国甲级联赛">法甲</button>

    <button class="league"
        data-sport="soccer_usa_mls"
        data-name="美国职业足球大联盟">MLS</button>

</aside>

<main>

    <div class="toolbar">

        <div id="leagueTitle">
            英格兰超级联赛
        </div>

        <input
            id="searchInput"
            placeholder="搜索球队">

        <button id="refreshBtn">
            刷新
        </button>

    </div>

    <div class="info">

        <div id="eventCount" class="pill">
            比赛 0
        </div>

        <div class="pill">
            已过滤低赔率及近似重复盘口
        </div>

        <div id="updated" class="pill">
            尚未更新
        </div>

    </div>

    <div id="events">
        <div class="loading">
            正在加载比赛
        </div>
    </div>

</main>

<aside class="betslip">

    <div class="bet-title">
        <span>模拟串关</span>
        <button id="clearBtn">清空</button>
    </div>

    <div id="picks"></div>

    <input
        id="stake"
        type="number"
        value="100"
        min="0"
        step="10">

    <div id="summary" class="summary"></div>

    <div class="note">
        仅用于赔率及组合回报模拟，不处理真实投注或资金。
    </div>

</aside>

</div>

<script>
"use strict";

/* =====================================================
   SETTINGS
===================================================== */

/*
 * 最低显示赔率。
 *
 * 1.01 ~ 1.09 全部隐藏。
 */
const MIN_DISPLAY_ODDS = 1.10;


/*
 * 亚洲盘主线间隔。
 *
 * 我们优先展示：
 *
 * 0
 * 0.5
 * 1
 * 1.5
 * 2
 * 2.5
 * 3
 * 3.5
 * 4
 *
 * .25 / .75 只有附近不存在主线时才显示。
 */
const MAIN_LINE_STEP = 0.5;


/* =====================================================
   STATE
===================================================== */

let currentSport = "soccer_epl";
let currentLeague = "英格兰超级联赛";

let events = [];
let openEvent = null;

const detailCache = new Map();

let picks = [];

try {
    const saved =
        JSON.parse(
            localStorage.getItem("sportsPlusPicks") || "[]"
        );

    if (Array.isArray(saved)) {
        picks = saved;
    }
} catch {
    picks = [];
}


/* =====================================================
   MARKET NAMES
===================================================== */

const MARKET_NAMES = {
    h2h:"胜平负",
    double_chance:"双重机会",
    draw_no_bet:"平局退款",

    spreads:"让球",
    alternate_spreads:"更多让球",

    totals:"全场大小球",
    alternate_totals:"更多大小球",

    btts:"两队都进球",

    team_totals:"球队进球大小",
    alternate_team_totals:"球队更多进球大小",

    h2h_h1:"半场胜平负",
    spreads_h1:"半场让球",
    totals_h1:"半场大小球",
    btts_h1:"半场两队进球",

    halftime_fulltime:"半场 / 全场",

    correct_score:"正确比分",
    correct_score_h1:"半场正确比分",

    corners:"总角球",
    alternate_corners:"更多角球",
    team_corners:"球队角球",
    alternate_team_corners:"球队更多角球",

    cards:"总牌数",
    alternate_cards:"更多牌数",

    player_goal_scorer_anytime:"球员任意时间进球",
    player_goal_scorer_first:"第一进球球员",
    player_goal_scorer_last:"最后进球球员",

    player_shots:"球员射门",
    player_shots_on_target:"球员射正",
    player_assists:"球员助攻",

    player_cards:"球员牌数",
    player_to_receive_card:"球员吃牌",
    player_to_receive_red_card:"球员红牌"
};


const PRIORITY = [
    "h2h",
    "double_chance",
    "draw_no_bet",

    "spreads",
    "alternate_spreads",

    "totals",
    "alternate_totals",

    "btts",

    "team_totals",
    "alternate_team_totals",

    "h2h_h1",
    "spreads_h1",
    "totals_h1",
    "btts_h1",

    "halftime_fulltime",

    "correct_score",
    "correct_score_h1",

    "corners",
    "alternate_corners",
    "team_corners",
    "alternate_team_corners",

    "cards",
    "alternate_cards",

    "player_goal_scorer_anytime",
    "player_goal_scorer_first",
    "player_goal_scorer_last",

    "player_shots",
    "player_shots_on_target",
    "player_assists",

    "player_cards",
    "player_to_receive_card",
    "player_to_receive_red_card"
];


/* =====================================================
   HELPERS
===================================================== */

function esc(value){
    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function jsEsc(value){
    return String(value ?? "")
        .replaceAll("\\","\\\\")
        .replaceAll("'","\\'");
}

function safeId(value){
    return String(value ?? "")
        .replace(/[^a-zA-Z0-9_-]/g,"");
}

function marketName(key){
    return MARKET_NAMES[key] ||
        String(key)
            .replaceAll("_"," ")
            .replace(/\b\w/g,x=>x.toUpperCase());
}

function priority(key){
    const i = PRIORITY.indexOf(key);
    return i < 0 ? 999 : i;
}

function dateText(value){
    if(!value) return "时间待定";

    const d = new Date(value);

    if(Number.isNaN(d.getTime())){
        return value;
    }

    return d.toLocaleString("zh-CN",{
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
    });
}


/* =====================================================
   API
===================================================== */

async function api(url){

    const response =
        await fetch(url,{
            cache:"no-store",
            headers:{
                Accept:"application/json"
            }
        });

    const text =
        await response.text();

    let data;

    try{
        data = JSON.parse(text);
    }catch{
        throw new Error(
            `HTTP ${response.status}：服务器返回非 JSON 内容`
        );
    }

    if(!response.ok){
        throw new Error(
            data.error ||
            data.message ||
            `HTTP ${response.status}`
        );
    }

    if(data.quota?.remaining !== undefined){
        document.getElementById("serverStatus").textContent =
            `API 剩余 ${data.quota.remaining}`;
    }

    return data;
}


/* =====================================================
   STATUS
===================================================== */

async function status(){

    const el =
        document.getElementById("serverStatus");

    try{

        const data =
            await api("/api/status");

        el.textContent =
            data.server === "SPORTS+ DETAIL"
                ? "SPORTS+ DETAIL 已连接"
                : "服务器已连接";

        el.className = "ok";

    }catch{

        el.textContent = "服务器连接失败";
        el.className = "error";

    }
}


/* =====================================================
   EVENTS
===================================================== */

async function loadEvents(){

    openEvent = null;

    const container =
        document.getElementById("events");

    container.innerHTML =
        `<div class="loading">正在加载比赛...</div>`;

    try{

        const data =
            await api(
                `/api/events/${encodeURIComponent(currentSport)}`
            );

        events =
            Array.isArray(data.events)
                ? data.events
                : [];

        document.getElementById("updated").textContent =
            "更新 " +
            new Date().toLocaleTimeString("zh-CN",{
                hour:"2-digit",
                minute:"2-digit"
            });

        renderEvents();

    }catch(error){

        container.innerHTML =
            `<div class="error">${esc(error.message)}</div>`;

    }
}


function renderEvents(){

    const search =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();

    const filtered =
        events.filter(event=>{

            const text =
                `${event.home_team || ""} ${event.away_team || ""}`
                    .toLowerCase();

            return !search || text.includes(search);

        });

    document.getElementById("eventCount").textContent =
        `比赛 ${filtered.length}`;

    if(!filtered.length){

        document.getElementById("events").innerHTML =
            `<div class="empty">没有找到比赛</div>`;

        return;
    }

    document.getElementById("events").innerHTML =
        filtered.map(event=>{

            const opened =
                event.id === openEvent;

            return `
                <div class="event ${opened ? "open" : ""}">

                    <div
                        class="event-head"
                        onclick="toggleEvent('${jsEsc(event.id)}')">

                        <div class="time">
                            ${esc(dateText(event.commence_time))}
                        </div>

                        <div>
                            <div class="team">
                                ${esc(event.home_team)}
                            </div>

                            <div class="team">
                                ${esc(event.away_team)}
                            </div>
                        </div>

                        <div class="open-text">
                            ${opened ? "收起 ▲" : "查看盘口 ›"}
                        </div>

                    </div>

                    <div
                        id="detail-${esc(event.id)}"
                        class="detail">
                    </div>

                </div>
            `;

        }).join("");

    if(openEvent && detailCache.has(openEvent)){

        const element =
            document.getElementById(`detail-${openEvent}`);

        if(element){
            renderDetail(
                element,
                detailCache.get(openEvent)
            );
        }
    }
}


/* =====================================================
   EVENT DETAILS
===================================================== */

async function toggleEvent(id){

    if(openEvent === id){

        openEvent = null;
        renderEvents();
        return;

    }

    openEvent = id;

    renderEvents();

    const container =
        document.getElementById(`detail-${id}`);

    if(!container) return;

    if(detailCache.has(id)){

        renderDetail(
            container,
            detailCache.get(id)
        );

        return;
    }

    container.innerHTML =
        `<div class="loading">正在加载详细盘口...</div>`;

    try{

        const marketResponse =
            await api(
                `/api/event/${encodeURIComponent(currentSport)}/${encodeURIComponent(id)}/markets`
            );

        let markets =
            Array.isArray(marketResponse.markets)
                ? [...new Set(marketResponse.markets)]
                : [];

        markets.sort((a,b)=>
            priority(a) - priority(b)
        );

        if(!markets.length){

            container.innerHTML =
                `<div class="empty">没有可用盘口</div>`;

            return;
        }

        const requested =
            markets.slice(0,28);

        const oddsResponse =
            await api(
                `/api/event/${encodeURIComponent(currentSport)}/${encodeURIComponent(id)}/odds?markets=${encodeURIComponent(requested.join(","))}`
            );

        const payload = {
            event:oddsResponse.event,
            markets
        };

        detailCache.set(id,payload);

        renderDetail(container,payload);

    }catch(error){

        console.error(error);

        container.innerHTML =
            `<div class="error">${esc(error.message)}</div>`;

    }
}


/* =====================================================
   DEDUPLICATION — STAGE 1
   SAME EXACT SELECTION
===================================================== */

function exactDeduplicate(event){

    const result =
        new Map();

    const bookmakers =
        Array.isArray(event?.bookmakers)
            ? event.bookmakers
            : [];

    bookmakers.forEach(bookmaker=>{

        const markets =
            Array.isArray(bookmaker.markets)
                ? bookmaker.markets
                : [];

        markets.forEach(market=>{

            if(!market.key) return;

            if(!result.has(market.key)){
                result.set(market.key,new Map());
            }

            const map =
                result.get(market.key);

            const outcomes =
                Array.isArray(market.outcomes)
                    ? market.outcomes
                    : [];

            outcomes.forEach(outcome=>{

                const price =
                    Number(outcome.price);

                /*
                 * 低赔率直接过滤。
                 */
                if(
                    !Number.isFinite(price) ||
                    price < MIN_DISPLAY_ODDS
                ){
                    return;
                }

                const description =
                    String(outcome.description || "").trim();

                const name =
                    String(outcome.name || "").trim();

                const point =
                    outcome.point === undefined ||
                    outcome.point === null
                        ? null
                        : Number(outcome.point);

                const key = [
                    description.toLowerCase(),
                    name.toLowerCase(),
                    point === null ? "" : point
                ].join("::");

                const existing =
                    map.get(key);

                /*
                 * 多 bookmaker 完全相同的选择：
                 * 只保留赔率最高的。
                 */
                if(
                    !existing ||
                    price > existing.price
                ){

                    map.set(key,{
                        description,
                        name,
                        point,
                        price,
                        bookmaker:
                            bookmaker.title ||
                            bookmaker.key ||
                            ""
                    });

                }

            });

        });

    });

    return result;
}


/* =====================================================
   DEDUPLICATION — STAGE 2
   REMOVE .25 / .75 WHEN MAIN LINE EXISTS
===================================================== */

function isQuarterLine(point){

    if(!Number.isFinite(point)){
        return false;
    }

    /*
     * 3.25 => fractional = .25
     * 3.75 => fractional = .75
     */

    const fractional =
        Math.abs(point) % 1;

    return (
        Math.abs(fractional - .25) < .001 ||
        Math.abs(fractional - .75) < .001
    );
}


function sameSelectionFamily(a,b){

    /*
     * 同一球员 / 球队 / description
     * + 同一方向 Over / Under 等。
     *
     * point 不参与比较。
     */

    return (
        String(a.description).toLowerCase() ===
        String(b.description).toLowerCase()
        &&
        String(a.name).toLowerCase() ===
        String(b.name).toLowerCase()
    );
}


function compressQuarterLines(outcomes){

    /*
     * 这里不是简单粗暴删除所有 .25/.75。
     *
     * 只有附近存在 .0/.5 主线时才删除。
     */

    return outcomes.filter(current=>{

        if(
            current.point === null ||
            !Number.isFinite(current.point)
        ){
            return true;
        }

        if(!isQuarterLine(current.point)){
            return true;
        }

        /*
         * 例如 3.75：
         *
         * 查找同方向的 3.5 或 4.0。
         *
         * 只要存在其中一个主线，
         * 3.75 就隐藏。
         */

        const hasNearbyMainLine =
            outcomes.some(other=>{

                if(other === current){
                    return false;
                }

                if(
                    other.point === null ||
                    !Number.isFinite(other.point)
                ){
                    return false;
                }

                if(!sameSelectionFamily(current,other)){
                    return false;
                }

                const difference =
                    Math.abs(
                        other.point -
                        current.point
                    );

                /*
                 * .25 away from .0/.5
                 */

                const isNearby =
                    Math.abs(difference - .25) < .001;

                if(!isNearby){
                    return false;
                }

                /*
                 * nearby point 必须是 .0/.5
                 */

                const doubled =
                    Math.abs(other.point * 2);

                return (
                    Math.abs(
                        doubled -
                        Math.round(doubled)
                    ) < .001
                );

            });

        return !hasNearbyMainLine;

    });
}


/* =====================================================
   BUILD DISPLAY MARKETS
===================================================== */

function buildMarkets(event){

    const exact =
        exactDeduplicate(event);

    const result =
        new Map();

    exact.forEach((map,key)=>{

        let outcomes =
            [...map.values()];

        /*
         * 压缩 .25/.75
         */
        outcomes =
            compressQuarterLines(outcomes);

        /*
         * 排序
         */
        outcomes.sort((a,b)=>{

            const textA =
                `${a.description} ${a.name}`;

            const textB =
                `${b.description} ${b.name}`;

            const textResult =
                textA.localeCompare(textB);

            if(textResult !== 0){
                return textResult;
            }

            if(
                a.point !== null &&
                b.point !== null
            ){
                return a.point - b.point;
            }

            return b.price - a.price;

        });

        if(outcomes.length){
            result.set(key,outcomes);
        }

    });

    return result;
}


/* =====================================================
   DETAIL RENDER
===================================================== */

function renderDetail(container,payload){

    const event =
        payload.event;

    if(!event){

        container.innerHTML =
            `<div class="empty">没有比赛详情</div>`;

        return;
    }

    const groups =
        buildMarkets(event);

    let keys =
        [...groups.keys()];

    keys.sort((a,b)=>{

        const diff =
            priority(a) - priority(b);

        return diff ||
            a.localeCompare(b);

    });

    if(!keys.length){

        container.innerHTML =
            `<div class="empty">
                当前盘口全部被过滤，或数据源没有可显示赔率
             </div>`;

        return;
    }

    let html = `

        <div class="detail-title">
            ${esc(event.home_team)}
            vs
            ${esc(event.away_team)}
        </div>

        <div class="detail-sub">
            ${esc(dateText(event.commence_time))}
            · ${keys.length} 种盘口
        </div>

        <div class="market-nav">

            ${keys.map(key=>`

                <button onclick="
                    document
                    .getElementById(
                        'm-${safeId(event.id)}-${safeId(key)}'
                    )
                    ?.scrollIntoView({
                        behavior:'smooth',
                        block:'center'
                    })
                ">
                    ${esc(marketName(key))}
                </button>

            `).join("")}

        </div>
    `;


    keys.forEach(key=>{

        const outcomes =
            groups.get(key);

        html += `

            <div
                class="market"
                id="m-${safeId(event.id)}-${safeId(key)}">

                <div class="market-title">

                    <span>
                        ${esc(marketName(key))}
                    </span>

                    <span class="market-count">
                        ${outcomes.length} 个选择
                    </span>

                </div>

                <div class="odds">
        `;


        outcomes.forEach(outcome=>{

            const point =
                outcome.point;

            const selection =
                outcome.description
                    ? `${outcome.description} · ${outcome.name}`
                    : outcome.name;

            const id = [
                event.id,
                key,
                outcome.description.toLowerCase(),
                outcome.name.toLowerCase(),
                point === null ? "" : point
            ].join("::");

            const selected =
                picks.some(p=>p.id === id);

            const pick = {
                id,
                eventId:event.id,
                event:
                    `${event.home_team} vs ${event.away_team}`,
                marketKey:key,
                market:marketName(key),
                selection,
                point,
                price:outcome.price
            };

            const encoded =
                encodeURIComponent(
                    JSON.stringify(pick)
                );

            html += `

                <button
                    class="odd ${selected ? "selected" : ""}"
                    onclick="addPick('${encoded}')">

                    <div class="odd-name">
                        ${esc(selection)}
                    </div>

                    <div class="odd-bottom">

                        <span class="point">
                            ${
                                point === null
                                    ? ""
                                    : esc(point)
                            }
                        </span>

                        <span class="price">
                            ${outcome.price.toFixed(2)}
                        </span>

                    </div>

                    <div class="source">
                        ${esc(outcome.bookmaker)}
                    </div>

                </button>
            `;

        });


        html += `
                </div>
            </div>
        `;

    });

    container.innerHTML = html;
}


/* =====================================================
   BET SLIP
===================================================== */

function addPick(encoded){

    const pick =
        JSON.parse(
            decodeURIComponent(encoded)
        );

    const existing =
        picks.findIndex(
            p=>p.id === pick.id
        );

    if(existing >= 0){

        picks.splice(existing,1);

    }else{

        /*
         * 同场同 market 只留一个选择。
         */

        picks =
            picks.filter(p=>
                !(
                    p.eventId === pick.eventId &&
                    p.marketKey === pick.marketKey
                )
            );

        picks.push(pick);

    }

    savePicks();
    renderPicks();
    refreshDetail();
}


function removePick(id){

    picks =
        picks.filter(
            p=>p.id !== id
        );

    savePicks();
    renderPicks();
    refreshDetail();
}


function savePicks(){

    localStorage.setItem(
        "sportsPlusPicks",
        JSON.stringify(picks)
    );

}


function refreshDetail(){

    if(!openEvent) return;

    const payload =
        detailCache.get(openEvent);

    const container =
        document.getElementById(
            `detail-${openEvent}`
        );

    if(payload && container){
        renderDetail(container,payload);
    }
}


function renderPicks(){

    const container =
        document.getElementById("picks");

    if(!picks.length){

        container.innerHTML =
            `<div class="empty">
                点击赔率加入模拟串关
             </div>`;

    }else{

        container.innerHTML =
            picks.map(p=>`

                <div class="pick">

                    <button
                        class="remove"
                        onclick='removePick(${JSON.stringify(p.id)})'>
                        ×
                    </button>

                    <div class="pick-market">
                        ${esc(p.market)}
                    </div>

                    <div class="pick-name">
                        ${esc(p.selection)}
                        ${
                            p.point === null
                                ? ""
                                : " " + esc(p.point)
                        }
                    </div>

                    <div class="pick-event">
                        ${esc(p.event)}
                    </div>

                    <div class="pick-price">
                        ${Number(p.price).toFixed(2)}
                    </div>

                </div>

            `).join("");

    }

    calculate();
}


function calculate(){

    const stake =
        Math.max(
            0,
            Number(
                document.getElementById("stake").value
            ) || 0
        );

    let total = 1;

    picks.forEach(p=>{
        total *= Number(p.price);
    });

    const payout =
        picks.length
            ? stake * total
            : 0;

    const profit =
        picks.length
            ? payout - stake
            : 0;

    document.getElementById("summary").innerHTML = `

        <div class="row">
            <span>选择</span>
            <span>${picks.length}</span>
        </div>

        <div class="row">
            <span>总赔率</span>
            <span class="green">
                ${picks.length ? total.toFixed(2) : "—"}
            </span>
        </div>

        <div class="row">
            <span>模拟金额</span>
            <span>$${stake.toFixed(2)}</span>
        </div>

        <div class="row">
            <span>模拟返还</span>
            <span class="green">
                ${picks.length ? "$"+payout.toFixed(2) : "—"}
            </span>
        </div>

        <div class="row">
            <span>模拟盈利</span>
            <span class="green">
                ${picks.length ? "$"+profit.toFixed(2) : "—"}
            </span>
        </div>
    `;
}


/* =====================================================
   CONTROLS
===================================================== */

document
.querySelectorAll(".league")
.forEach(button=>{

    button.addEventListener("click",()=>{

        document
        .querySelectorAll(".league")
        .forEach(x=>x.classList.remove("active"));

        button.classList.add("active");

        currentSport =
            button.dataset.sport;

        currentLeague =
            button.dataset.name;

        document.getElementById("leagueTitle").textContent =
            currentLeague;

        document.getElementById("searchInput").value =
            "";

        detailCache.clear();

        loadEvents();

    });

});


document
.getElementById("searchInput")
.addEventListener(
    "input",
    renderEvents
);


document
.getElementById("refreshBtn")
.addEventListener("click",()=>{

    detailCache.clear();
    loadEvents();

});


document
.getElementById("stake")
.addEventListener(
    "input",
    calculate
);


document
.getElementById("clearBtn")
.addEventListener("click",()=>{

    picks = [];

    savePicks();
    renderPicks();
    refreshDetail();

});


/* =====================================================
   START
===================================================== */

renderPicks();
status();
loadEvents();

</script>
