<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>SPORTS+</title>

<style>

:root{
    --bg:#070a0f;
    --side:#0c1118;
    --panel:#111923;
    --panel2:#172230;
    --panel3:#1c2a3a;
    --border:#29384a;
    --text:#f4f7fb;
    --muted:#8b99aa;
    --green:#55e78b;
    --red:#ff6868;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

/* ==============================================
   HEADER
============================================== */

header{
    height:64px;
    display:flex;
    align-items:center;
    padding:0 22px;
    background:#090e15;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:24px;
    font-weight:900;
}

.logo span{
    color:var(--green);
}

.header-sub{
    margin-left:25px;
    color:var(--muted);
    font-size:12px;
}

#status{
    margin-left:auto;
    color:var(--muted);
    font-size:12px;
}

#status.ok{
    color:var(--green);
}

#status.error{
    color:var(--red);
}

/* ==============================================
   LAYOUT
============================================== */

.layout{
    display:grid;
    grid-template-columns:
        205px
        minmax(0,1fr)
        330px;

    min-height:
        calc(100vh - 64px);
}

/* ==============================================
   LEFT
============================================== */

.left{
    background:var(--side);
    border-right:1px solid var(--border);
    padding:14px 10px;
}

.side-title{
    padding:8px 11px;
    color:var(--muted);
    font-size:11px;
}

.league{
    width:100%;
    display:block;
    border:0;
    background:transparent;
    color:#dfe6ee;
    padding:11px 12px;
    text-align:left;
    border-radius:8px;
    margin-bottom:3px;
}

.league:hover{
    background:var(--panel2);
}

.league.active{
    background:var(--panel3);
    color:var(--green);
    font-weight:800;
}

/* ==============================================
   MAIN
============================================== */

main{
    min-width:0;
    padding:18px;
}

.toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

#leagueName{
    font-size:20px;
    font-weight:900;
    white-space:nowrap;
}

#search{
    flex:1;
    min-width:0;
    background:var(--panel);
    color:white;
    border:1px solid var(--border);
    border-radius:9px;
    padding:11px 13px;
    outline:none;
}

#refresh{
    background:var(--panel2);
    color:white;
    border:1px solid var(--border);
    border-radius:9px;
    padding:11px 15px;
}

.stats{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.stat{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--muted);
    border-radius:20px;
    padding:7px 10px;
    font-size:11px;
}

/* ==============================================
   EVENT
============================================== */

.event{
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:11px;
    overflow:hidden;
    margin-bottom:10px;
}

.event.open{
    border-color:#38506b;
}

.event-head{
    display:grid;
    grid-template-columns:
        105px
        minmax(0,1fr)
        auto;

    align-items:center;
    gap:13px;
    padding:15px;
    cursor:pointer;
}

.event-head:hover{
    background:var(--panel2);
}

.event-time{
    color:var(--muted);
    font-size:12px;
}

.team{
    font-weight:800;
    margin:3px 0;
}

.event-action{
    color:var(--green);
    font-size:12px;
}

.detail{
    display:none;
    border-top:1px solid var(--border);
    background:#0d151f;
    padding:15px;
}

.event.open .detail{
    display:block;
}

/* ==============================================
   EVENT DETAIL
============================================== */

.match-title{
    font-size:18px;
    font-weight:900;
}

.match-meta{
    margin-top:5px;
    color:var(--muted);
    font-size:11px;
}

/* ==============================================
   CATEGORY NAV
============================================== */

.categories{
    display:flex;
    gap:6px;
    overflow-x:auto;
    margin-top:15px;
    margin-bottom:15px;
    padding-bottom:5px;
}

.category{
    flex:0 0 auto;
    border:1px solid var(--border);
    background:var(--panel2);
    color:#dce4ed;
    padding:8px 11px;
    border-radius:7px;
    font-size:11px;
}

.category:hover{
    color:var(--green);
    border-color:var(--green);
}

/* ==============================================
   CATEGORY
============================================== */

.category-section{
    margin-top:18px;
}

.category-title{
    font-size:16px;
    font-weight:900;
    margin-bottom:9px;
}

/* ==============================================
   MARKET
============================================== */

.market{
    border:1px solid var(--border);
    border-radius:9px;
    overflow:hidden;
    margin-bottom:10px;
}

.market-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:11px 12px;
    background:var(--panel2);
}

.market-name{
    font-size:13px;
    font-weight:850;
}

.market-count{
    color:var(--muted);
    font-size:10px;
}

.odds{
    padding:9px;
    display:grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(145px,1fr)
        );
    gap:7px;
}

.odd{
    min-width:0;
    background:var(--panel2);
    border:1px solid var(--border);
    color:white;
    border-radius:8px;
    padding:10px;
    text-align:left;
}

.odd:hover{
    border-color:var(--green);
}

.odd.selected{
    border-color:var(--green);
    background:
        rgba(85,231,139,.11);
}

.odd-name{
    font-size:11px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.odd-bottom{
    margin-top:7px;
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.line{
    color:var(--muted);
    font-size:11px;
}

.price{
    color:var(--green);
    font-weight:900;
}

.source{
    color:#617186;
    font-size:9px;
    margin-top:5px;
}

/* ==============================================
   RIGHT
============================================== */

.right{
    background:var(--side);
    border-left:1px solid var(--border);
    padding:16px;
}

.slip-title{
    display:flex;
    justify-content:space-between;
    font-size:18px;
    font-weight:900;
    margin-bottom:12px;
}

#clear{
    border:0;
    background:none;
    color:var(--red);
    font-size:11px;
}

.pick{
    border-bottom:1px solid var(--border);
    padding:11px 0;
}

.pick-market{
    color:var(--muted);
    font-size:10px;
}

.pick-selection{
    margin-top:4px;
    font-weight:800;
    font-size:13px;
}

.pick-event{
    margin-top:5px;
    color:var(--muted);
    font-size:10px;
}

.pick-price{
    margin-top:5px;
    color:var(--green);
    font-weight:900;
}

.remove{
    float:right;
    border:0;
    background:none;
    color:var(--red);
}

#stake{
    width:100%;
    margin-top:15px;
    padding:11px;
    background:var(--panel);
    color:white;
    border:1px solid var(--border);
    border-radius:8px;
}

.summary{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:9px;
    padding:12px;
    margin-top:12px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    margin:8px 0;
}

.summary-row span:first-child{
    color:var(--muted);
}

.green{
    color:var(--green);
    font-weight:900;
}

.notice{
    color:var(--muted);
    font-size:10px;
    line-height:1.5;
    margin-top:13px;
}

.loading,
.empty,
.error{
    text-align:center;
    padding:30px 15px;
    color:var(--muted);
}

.error{
    color:var(--red);
}

/* ==============================================
   MOBILE
============================================== */

@media(max-width:1050px){

    .layout{
        grid-template-columns:
            185px
            minmax(0,1fr);
    }

    .right{
        display:none;
    }
}

@media(max-width:700px){

    .layout{
        display:block;
    }

    .left{
        display:flex;
        overflow-x:auto;
        border-right:0;
        border-bottom:
            1px solid var(--border);
    }

    .side-title{
        display:none;
    }

    .league{
        width:auto;
        flex:0 0 auto;
        white-space:nowrap;
    }

    main{
        padding:11px;
    }

    #leagueName{
        display:none;
    }

    .event-head{
        grid-template-columns:
            80px
            minmax(0,1fr);
    }

    .event-action{
        grid-column:2;
    }

    .odds{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }
}

</style>
</head>

<script>

"use strict";


/* ============================================================
   SETTINGS
============================================================ */

const MIN_ODDS = 1.10;


/*

 */
const SCORE_WHITELIST = new Set([

/* ============================================================
   CATEGORY CONFIGURATION
============================================================ */

const CATEGORIES = [

    {

];


/* ============================================================
   DISPLAY NAMES
============================================================ */

const MARKET_NAMES = {

    h2h:
        "Match Result",

    totals:
        "Total Goals",

    btts:
        "Both Teams To Score",

    spreads:

    double_chance:

    draw_no_bet:

    team_totals:

    alternate_team_totals:

    h2h_h1:
        "1st Half Result",

    spreads_h1:

    totals_h1:
        "1st Half Total Goals",

    btts_h1:
        "1st Half Both Teams To Score",

    halftime_fulltime:
        "Half Time / Full Time",

    correct_score:

    correct_score_h1:

    corners:

        "Player To Receive A Card",

    player_to_receive_red_card:
        "Player To Receive A Red Card"
};


/* ============================================================
   STATE
============================================================ */

let currentSport =
    "soccer_epl";

let currentLeague =
    "英格兰超级联赛";

let currentEvents = [];

let openEventId = null;

const eventCache =
    new Map();

let picks = [];


try {

    const stored =
        JSON.parse(
            localStorage.getItem(
                "sportsPlusPicks"
            ) || "[]"
        );

    if (Array.isArray(stored)) {
        picks = stored;
    }

} catch {

    picks = [];

}


/* ============================================================
   HELPERS
============================================================ */

function esc(value) {

    return String(value ?? "")

        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function jsEsc(value) {

    return String(value ?? "")

        .replaceAll("\\","\\\\")
        .replaceAll("'","\\'");
}


function safeId(value) {

    return String(value ?? "")

        .replace(
            /[^a-zA-Z0-9_-]/g,
            ""
        );
}


function formatDate(value) {

    if (!value) {
        return "时间待定";
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return value;
    }

    return date.toLocaleString(

        "zh-CN",

        {
            month:"2-digit",
            day:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
        }

    );
}


function marketName(key) {

    return (
        MARKET_NAMES[key] ||
        key
    );
}


/* ============================================================
   TOTAL GOAL LINE FILTER

   ONLY:

   0.5
   1.5
   2.5
   3.5
   4.5
   5.5
   ...
============================================================ */

function isHalfGoalLine(point) {

    const number =
        Number(point);

    if (
        !Number.isFinite(number)
    ) {
        return false;
    }

    const fractional =
        Math.abs(number) % 1;

    return (
        Math.abs(
            fractional - 0.5
        ) < 0.001
    );
}


/*
 * 哪些盘口执行 .5 过滤。
 */
function requiresHalfLine(key) {

    return [
        "totals",
        "alternate_totals",
        "team_totals",
        "alternate_team_totals",
        "totals_h1"
    ].includes(key);
}


/* ============================================================
   SCORE FILTER
============================================================ */

function normalizeScore(value) {

    return String(value || "")

        .replace(/\s/g,"")

        .replace("–","-")

        .replace("—","-");
}


function scoreAllowed(outcome) {

    const candidates = [
        outcome.name,
        outcome.description
    ];

    for (
        const candidate
        of candidates
    ) {

        const score =
            normalizeScore(candidate);

        if (
            SCORE_WHITELIST.has(score)
        ) {
            return true;
        }

        /*
         * 如果数据源提供 Other Home Win /
         * Any Other Draw 等，保留。
         */
        if (
            /other/i.test(
                String(candidate || "")
            )
        ) {
            return true;
        }

    }

    return false;
}


/* ============================================================
   API
============================================================ */

async function api(url) {

    const response =
        await fetch(
            url,
            {
                cache:"no-store",

                headers:{
                    Accept:
                        "application/json"
                }
            }
        );


    const text =
        await response.text();


    let data;


    try {

        data =
            JSON.parse(text);

    } catch {

        throw new Error(

            `HTTP ${response.status} 返回非 JSON`

        );

    }


    if (!response.ok) {

        throw new Error(

            data.error ||
            data.message ||
            `HTTP ${response.status}`

        );

    }


    if (
        data.quota?.remaining !==
        undefined
    ) {

        document.getElementById(
            "status"
        ).textContent =

            `API 剩余 ${data.quota.remaining}`;

    }


    return data;
}


/* ============================================================
   SERVER STATUS
============================================================ */

async function loadStatus() {

    const element =
        document.getElementById(
            "status"
        );


    try {

        const data =
            await api(
                "/api/status"
            );


        element.textContent =

            data.server ===
            "SPORTS+ BOOK"

                ? "SPORTS+ BOOK 已连接"

                : "服务器已连接";


        element.className =
            "ok";

    } catch {

        element.textContent =
            "服务器连接失败";

        element.className =
            "error";

    }
}


/* ============================================================
   EVENTS
============================================================ */

async function loadEvents() {

    openEventId =
        null;


    const container =
        document.getElementById(
            "events"
        );


    container.innerHTML =

        `<div class="loading">
            正在加载比赛...
        </div>`;


    try {

        const data =
            await api(

                `/api/events/${encodeURIComponent(currentSport)}`

            );


        currentEvents =
            Array.isArray(data.events)

                ? data.events

                : [];


        renderEvents();

    } catch (error) {

        container.innerHTML =

            `<div class="error">
                ${esc(error.message)}
            </div>`;

    }
}


/* ============================================================
   EVENT LIST
============================================================ */

function renderEvents() {

    const search =
        document

            .getElementById(
                "search"
            )

            .value

            .trim()

            .toLowerCase();


    const filtered =
        currentEvents.filter(
            event => {

                const text =

                    `${event.home_team || ""} ` +

                    `${event.away_team || ""}`;


                return (

                    !search ||

                    text
                        .toLowerCase()
                        .includes(search)

                );

            }
        );


    document.getElementById(
        "eventCount"
    ).textContent =

        `比赛 ${filtered.length}`;


    if (!filtered.length) {

        document.getElementById(
            "events"
        ).innerHTML =

            `<div class="empty">
                没有找到比赛
            </div>`;

        return;
    }


    document.getElementById(
        "events"
    ).innerHTML =

        filtered.map(
            event => {

                const opened =

                    event.id ===
                    openEventId;


                return `

                    <section
                        class="event ${opened ? "open" : ""}">


                        <div

                            class="event-head"

                            onclick="toggleEvent('${jsEsc(event.id)}')">


                            <div class="event-time">

                                ${esc(
                                    formatDate(
                                        event.commence_time
                                    )
                                )}

                            </div>


                            <div>

                                <div class="team">

                                    ${esc(
                                        event.home_team
                                    )}

                                </div>


                                <div class="team">

                                    ${esc(
                                        event.away_team
                                    )}

                                </div>

                            </div>


                            <div class="event-action">

                                ${
                                    opened
                                        ? "收起 ▲"
                                        : "查看盘口 ›"
                                }

                            </div>


                        </div>


                        <div

                            id="detail-${esc(event.id)}"

                            class="detail">

                        </div>


                    </section>

                `;

            }

        ).join("");


    if (
        openEventId &&
        eventCache.has(openEventId)
    ) {

        const detail =
            document.getElementById(

                `detail-${openEventId}`

            );


        if (detail) {

            renderDetail(

                detail,

                eventCache.get(
                    openEventId
                )

            );

        }

    }
}


/* ============================================================
   OPEN MATCH
============================================================ */

async function toggleEvent(
    eventId
) {

    if (
        openEventId ===
        eventId
    ) {

        openEventId =
            null;

        renderEvents();

        return;
    }


    openEventId =
        eventId;


    renderEvents();


    const container =
        document.getElementById(

            `detail-${eventId}`

        );


    if (!container) {
        return;
    }


    if (
        eventCache.has(eventId)
    ) {

        renderDetail(

            container,

            eventCache.get(
                eventId
            )

        );

        return;
    }


    container.innerHTML =

        `<div class="loading">
            正在读取盘口...
        </div>`;


    try {

        /*
         * 先查询本场真正存在的 market。
         */

        const available =
            await api(

                `/api/event/` +

                `${encodeURIComponent(currentSport)}/` +

                `${encodeURIComponent(eventId)}/markets`

            );


        const availableSet =
            new Set(

                Array.isArray(
                    available.markets
                )

                    ? available.markets

                    : []

            );


        /*
         * 从分类配置中生成我们真正想要的 market。
         */
        const wanted =
            new Set();


        CATEGORIES.forEach(
            category => {

                category.markets.forEach(
                    key => {

                        if (
                            availableSet.has(key)
                        ) {

                            wanted.add(key);

                        }

                    }
                );

            }
        );


        const markets =
            [...wanted];


        if (!markets.length) {

            container.innerHTML =

                `<div class="empty">
                    本场没有可用详细盘口
                </div>`;

            return;
        }


        /*
         * 一次请求我们真正需要的 markets。
         */
        const odds =
            await api(

                `/api/event/` +

                `${encodeURIComponent(currentSport)}/` +

                `${encodeURIComponent(eventId)}/odds` +

                `?markets=` +

                encodeURIComponent(
                    markets.join(",")
                )

            );


        const payload = {

            event:
                odds.event,

            markets

        };


        eventCache.set(

            eventId,

            payload

        );


        renderDetail(

            container,

            payload

        );

    } catch (error) {

        console.error(
            error
        );


        container.innerHTML =

            `<div class="error">
                ${esc(error.message)}
            </div>`;

    }
}


/* ============================================================
   DEDUPLICATE

   SAME:
   market
   description
   name
   point

   -> keep highest displayed odds
============================================================ */

function buildMarkets(event) {

    const result =
        new Map();


    const bookmakers =
        Array.isArray(
            event?.bookmakers
        )

            ? event.bookmakers

            : [];


    bookmakers.forEach(
        bookmaker => {


            const markets =
                Array.isArray(
                    bookmaker.markets
                )

                    ? bookmaker.markets

                    : [];


            markets.forEach(
                market => {


                    const key =
                        market.key;


                    if (!key) {
                        return;
                    }


                    if (
                        !result.has(key)
                    ) {

                        result.set(

                            key,

                            new Map()

                        );

                    }


                    const selectionMap =
                        result.get(key);


                    const outcomes =
                        Array.isArray(
                            market.outcomes
                        )

                            ? market.outcomes

                            : [];


                    outcomes.forEach(
                        outcome => {


                            const price =
                                Number(
                                    outcome.price
                                );


                            /*
                             * 低赔率过滤。
                             */
                            if (
                                !Number.isFinite(price) ||
                                price < MIN_ODDS
                            ) {
                                return;
                            }


                            const description =

                                String(

                                    outcome.description ||
                                    ""

                                ).trim();


                            const name =

                                String(

                                    outcome.name ||
                                    ""

                                ).trim();


                            const point =

                                outcome.point ===
                                undefined ||

                                outcome.point ===
                                null

                                    ? null

                                    : Number(
                                        outcome.point
                                    );


                            /*
                             * Goals 类盘口：
                             *
                             * 只允许 X.5。
                             */
                            if (
                                requiresHalfLine(key)
                            ) {

                                if (
                                    point === null ||
                                    !isHalfGoalLine(point)
                                ) {
                                    return;
                                }

                            }


                            /*
                             * Correct Score：
                             *
                             * 只保留精简比分。
                             */
                            if (
                                key ===
                                    "correct_score" ||

                                key ===
                                    "correct_score_h1"
                            ) {

                                if (
                                    !scoreAllowed(
                                        outcome
                                    )
                                ) {
                                    return;
                                }

                            }


                            const uniqueKey = [

                                description
                                    .toLowerCase(),

                                name
                                    .toLowerCase(),

                                point === null
                                    ? ""
                                    : point

                            ].join("::");


                            const existing =
                                selectionMap.get(
                                    uniqueKey
                                );


                            /*
                             * 多 bookmaker 同一盘口：
                             * 留最高显示赔率。
                             */
                            if (
                                !existing ||
                                price >
                                existing.price
                            ) {

                                selectionMap.set(

                                    uniqueKey,

                                    {

                                        description,

                                        name,

                                        point,

                                        price,

                                        bookmaker:

                                            bookmaker.title ||

                                            bookmaker.key ||

                                            ""

                                    }

                                );

                            }

                        }

                    );

                }

            );

        }

    );


    const final =
        new Map();


    result.forEach(
        (
            selectionMap,
            key
        ) => {


            const outcomes =

                [...selectionMap.values()];


            outcomes.sort(
                (a,b) => {


                    const descriptionCompare =

                        a.description.localeCompare(
                            b.description
                        );


                    if (
                        descriptionCompare !==
                        0
                    ) {

                        return descriptionCompare;

                    }


                    const nameCompare =

                        a.name.localeCompare(
                            b.name
                        );


                    if (
                        nameCompare !==
                        0
                    ) {

                        return nameCompare;

                    }


                    if (
                        a.point !== null &&
                        b.point !== null
                    ) {

                        return (
                            a.point -
                            b.point
                        );

                    }


                    return (
                        b.price -
                        a.price
                    );

                }
            );


            if (
                outcomes.length
            ) {

                final.set(
                    key,
                    outcomes
                );

            }

        }

    );


    return final;
}


/* ============================================================
   RENDER DETAIL
============================================================ */

function renderDetail(
    container,
    payload
) {

    const event =
        payload.event;


    if (!event) {

        container.innerHTML =

            `<div class="empty">
                没有比赛数据
            </div>`;

        return;
    }


    const groups =
        buildMarkets(event);


    /*
     * 只显示真正有数据的 category。
     */
    const categories =
        CATEGORIES.map(
            category => {


                const markets =

                    category.markets.filter(

                        key =>
                            groups.has(key)

                    );


                return {

                    ...category,

                    markets

                };

            }
        )

        .filter(
            category =>
                category.markets.length
        );


    if (!categories.length) {

        container.innerHTML =

            `<div class="empty">
                没有符合当前精简规则的盘口
            </div>`;

        return;
    }


    let html = `

        <div class="match-title">

            ${esc(
                event.home_team
            )}

            vs

            ${esc(
                event.away_team
            )}

        </div>


        <div class="match-meta">

            ${esc(
                formatDate(
                    event.commence_time
                )
            )}

        </div>


        <div class="categories">

            ${
                categories.map(
                    category => `

                        <button

                            class="category"

                            onclick="

                                document

                                .getElementById(

                                    'category-${safeId(event.id)}-${safeId(category.id)}'

                                )

                                ?.scrollIntoView({

                                    behavior:'smooth',

                                    block:'start'

                                });

                            ">

                            ${esc(
                                category.title
                            )}

                        </button>

                    `

                ).join("")
            }

        </div>

    `;


    categories.forEach(
        category => {


            html += `

                <section

                    id="category-${safeId(event.id)}-${safeId(category.id)}"

                    class="category-section">


                    <div class="category-title">

                        ${esc(
                            category.title
                        )}

                    </div>

            `;


            category.markets.forEach(
                marketKey => {


                    const outcomes =
                        groups.get(
                            marketKey
                        ) || [];


                    if (
                        !outcomes.length
                    ) {
                        return;
                    }


                    html += `

                        <div class="market">


                            <div class="market-head">


                                <span class="market-name">

                                    ${esc(
                                        marketName(
                                            marketKey
                                        )
                                    )}

                                </span>


                                <span class="market-count">

                                    ${outcomes.length}
                                    selections

                                </span>


                            </div>


                            <div class="odds">

                    `;


                    outcomes.forEach(
                        outcome => {


                            const selection =

                                outcome.description

                                    ? `${outcome.description} · ${outcome.name}`

                                    : outcome.name;


                            const id = [

                                event.id,

                                marketKey,

                                outcome.description
                                    .toLowerCase(),

                                outcome.name
                                    .toLowerCase(),

                                outcome.point === null
                                    ? ""
                                    : outcome.point

                            ].join("::");


                            const selected =

                                picks.some(

                                    pick =>
                                        pick.id ===
                                        id

                                );


                            const pick = {

                                id,

                                eventId:
                                    event.id,

                                event:

                                    `${event.home_team} vs ${event.away_team}`,

                                marketKey,

                                market:

                                    marketName(
                                        marketKey
                                    ),

                                selection,

                                point:
                                    outcome.point,

                                price:
                                    outcome.price

                            };


                            const encoded =

                                encodeURIComponent(

                                    JSON.stringify(
                                        pick
                                    )

                                );


                            html += `

                                <button

                                    class="odd ${selected ? "selected" : ""}"

                                    onclick="addPick('${encoded}')">


                                    <div class="odd-name">

                                        ${esc(
                                            selection
                                        )}

                                    </div>


                                    <div class="odd-bottom">


                                        <span class="line">

                                            ${
                                                outcome.point ===
                                                null

                                                    ? ""

                                                    : esc(
                                                        outcome.point
                                                    )
                                            }

                                        </span>


                                        <span class="price">

                                            ${Number(
                                                outcome.price
                                            ).toFixed(2)}

                                        </span>


                                    </div>


                                    <div class="source">

                                        ${esc(
                                            outcome.bookmaker
                                        )}

                                    </div>


                                </button>

                            `;

                        }

                    );


                    html += `

                            </div>

                        </div>

                    `;

                }

            );


            html += `

                </section>

            `;

        }

    );


    container.innerHTML =
        html;
}


/* ============================================================
   BET SLIP
============================================================ */

function addPick(encoded) {

    const pick =
        JSON.parse(

            decodeURIComponent(
                encoded
            )

        );


    const index =
        picks.findIndex(

            item =>
                item.id ===
                pick.id

        );


    if (
        index !== -1
    ) {

        picks.splice(
            index,
            1
        );

    } else {

        /*
         * 同一场、同一个 market，
         * 模拟串关只留一个选择。
         */
        picks =
            picks.filter(

                item =>

                    !(
                        item.eventId ===
                            pick.eventId &&

                        item.marketKey ===
                            pick.marketKey
                    )

            );


        picks.push(
            pick
        );

    }


    savePicks();

    renderPicks();

    refreshDetail();
}


function removePick(id) {

    picks =
        picks.filter(

            pick =>
                pick.id !==
                id

        );


    savePicks();

    renderPicks();

    refreshDetail();
}


function savePicks() {

    localStorage.setItem(

        "sportsPlusPicks",

        JSON.stringify(
            picks
        )

    );
}


function refreshDetail() {

    if (!openEventId) {
        return;
    }


    const payload =
        eventCache.get(
            openEventId
        );


    const container =
        document.getElementById(

            `detail-${openEventId}`

        );


    if (
        payload &&
        container
    ) {

        renderDetail(
            container,
            payload
        );

    }
}


/* ============================================================
   PICKS
============================================================ */

function renderPicks() {

    const container =
        document.getElementById(
            "picks"
        );


    if (!picks.length) {

        container.innerHTML =

            `<div class="empty">
                点击赔率加入模拟串关
            </div>`;

    } else {

        container.innerHTML =

            picks.map(
                pick => `

                    <div class="pick">


                        <button

                            class="remove"

                            onclick='removePick(${JSON.stringify(pick.id)})'>

                            ×

                        </button>


                        <div class="pick-market">

                            ${esc(
                                pick.market
                            )}

                        </div>


                        <div class="pick-selection">

                            ${esc(
                                pick.selection
                            )}

                            ${
                                pick.point === null

                                    ? ""

                                    : " " +
                                      esc(
                                          pick.point
                                      )
                            }

                        </div>


                        <div class="pick-event">

                            ${esc(
                                pick.event
                            )}

                        </div>


                        <div class="pick-price">

                            ${Number(
                                pick.price
                            ).toFixed(2)}

                        </div>


                    </div>

                `

            ).join("");

    }


    calculate();
}


/* ============================================================
   CALCULATOR
============================================================ */

function calculate() {

    const stake =

        Math.max(

            0,

            Number(

                document.getElementById(
                    "stake"
                ).value

            ) || 0

        );


    let total =
        1;


    picks.forEach(
        pick => {

            const price =
                Number(
                    pick.price
                );


            if (
                Number.isFinite(price)
            ) {

                total *=
                    price;

            }

        }
    );


    const payout =

        picks.length

            ? stake *
              total

            : 0;


    const profit =

        picks.length

            ? payout -
              stake

            : 0;


    document.getElementById(
        "summary"
    ).innerHTML = `


        <div class="summary-row">

            <span>
                选择
            </span>

            <span>
                ${picks.length}
            </span>

        </div>


        <div class="summary-row">

            <span>
                总赔率
            </span>

            <span class="green">

                ${
                    picks.length

                        ? total.toFixed(2)

                        : "—"
                }

            </span>

        </div>


        <div class="summary-row">

            <span>
                模拟金额
            </span>

            <span>

                $${stake.toFixed(2)}

            </span>

        </div>


        <div class="summary-row">

            <span>
                模拟返还
            </span>

            <span class="green">

                ${
                    picks.length

                        ? "$" +
                          payout.toFixed(2)

                        : "—"
                }

            </span>

        </div>


        <div class="summary-row">

            <span>
                模拟盈利
            </span>

            <span class="green">

                ${
                    picks.length

                        ? "$" +
                          profit.toFixed(2)

                        : "—"
                }

            </span>

        </div>

    `;
}

   CONTROLS
