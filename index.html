<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SPORTS 模拟中心</title>

<style>

*{
    box-sizing:border-box;
}

:root{
    --bg:#080c12;
    --panel:#111821;
    --panel2:#17212d;
    --border:#263444;
    --text:#f4f7fa;
    --muted:#8f9cab;
    --green:#41df76;
    --green2:#163e27;
    --red:#ff6969;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Microsoft YaHei",
    sans-serif;
}

button,
input{
    font:inherit;
}

/* HEADER */

header{
    height:68px;
    background:#0e151e;
    border-bottom:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 22px;

    position:sticky;
    top:0;

    z-index:20;
}

.logo{
    font-size:22px;
    font-weight:900;
}

.logo span{
    color:var(--green);
}

.status{
    color:var(--muted);
    font-size:12px;
}

.live-dot{
    display:inline-block;

    width:8px;
    height:8px;

    border-radius:50%;

    background:var(--green);

    margin-right:5px;
}

/* MAIN */

.layout{
    max-width:1500px;

    margin:auto;

    display:grid;

    grid-template-columns:
        190px
        minmax(0,1fr)
        360px;

    gap:15px;

    padding:15px;
}

/* SIDEBAR */

.sidebar,
.betslip{
    background:var(--panel);

    border:
        1px solid
        var(--border);

    border-radius:12px;

    height:max-content;
}

.sidebar{
    padding:12px;

    position:sticky;
    top:83px;
}

.side-title{
    color:var(--muted);

    font-size:12px;

    margin:
        8px 8px 10px;
}

.sport{
    padding:11px;

    border-radius:8px;

    cursor:pointer;

    margin-bottom:4px;
}

.sport:hover{
    background:var(--panel2);
}

.sport.active{
    background:var(--green2);
    color:var(--green);
    font-weight:700;
}

/* CONTENT */

.topbar{
    display:flex;

    gap:8px;

    margin-bottom:12px;

    flex-wrap:wrap;
}

.filter{
    border:
        1px solid
        var(--border);

    background:var(--panel);

    color:white;

    padding:
        9px 15px;

    border-radius:20px;

    cursor:pointer;
}

.filter.active{
    background:var(--green);
    color:#071009;
    border-color:var(--green);

    font-weight:800;
}

.search{
    flex:1;

    min-width:160px;

    background:var(--panel);

    border:
        1px solid
        var(--border);

    color:white;

    border-radius:20px;

    padding:
        9px 15px;
}

/* LEAGUE */

.league-title{
    margin:
        20px 4px
        8px;

    color:#b7c0ca;

    font-size:14px;

    font-weight:700;
}

/* GAME */

.game{
    background:var(--panel);

    border:
        1px solid
        var(--border);

    border-radius:11px;

    margin-bottom:10px;

    overflow:hidden;
}

.game-head{
    padding:14px;

    display:flex;

    justify-content:
        space-between;

    align-items:center;

    cursor:pointer;
}

.game-head:hover{
    background:#141e29;
}

.game-time{
    color:var(--muted);

    font-size:12px;

    margin-bottom:5px;
}

.team{
    font-weight:700;
    line-height:1.65;
}

.expand{
    color:var(--green);
    font-size:13px;
}

/* MARKETS */

.markets{
    border-top:
        1px solid
        var(--border);

    padding:13px;
}

.market{
    margin-bottom:17px;
}

.market:last-child{
    margin-bottom:0;
}

.market-name{
    font-size:13px;

    color:#9da9b7;

    margin-bottom:7px;
}

.odds-grid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(110px,1fr)
        );

    gap:7px;
}

.odd{
    border:
        1px solid
        #334357;

    background:#1b2633;

    border-radius:7px;

    padding:
        9px 8px;

    cursor:pointer;

    display:flex;

    justify-content:
        space-between;

    gap:8px;
}

.odd:hover{
    border-color:var(--green);
}

.odd.selected{
    background:var(--green2);
    border-color:var(--green);
}

.odd-name{
    font-size:12px;
    color:#c2cad3;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.price{
    color:var(--green);

    font-weight:800;

    font-size:14px;
}

/* BET SLIP */

.betslip{
    position:sticky;

    top:83px;

    padding:15px;
}

.bet-title{
    font-size:18px;

    font-weight:800;

    margin-bottom:3px;
}

.bet-count{
    color:var(--muted);

    font-size:12px;

    margin-bottom:12px;
}

.empty{
    text-align:center;

    color:#758292;

    padding:
        45px 10px;
}

.pick{
    border-bottom:
        1px solid
        var(--border);

    padding:
        11px 0;
}

.pick-top{
    display:flex;

    justify-content:
        space-between;

    gap:10px;
}

.pick-name{
    font-weight:750;
}

.pick-market,
.pick-event{
    color:var(--muted);

    font-size:11px;

    margin-top:4px;
}

.pick-price{
    color:var(--green);

    font-weight:800;

    margin-top:6px;
}

.remove{
    background:none;

    border:0;

    color:var(--red);

    cursor:pointer;

    font-size:18px;
}

.summary{
    margin-top:15px;
}

.row{
    display:flex;

    justify-content:
        space-between;

    margin:
        10px 0;
}

.total{
    color:var(--green);

    font-size:22px;

    font-weight:900;
}

.stake{
    width:100%;

    padding:12px;

    background:#090e14;

    border:
        1px solid
        var(--border);

    border-radius:8px;

    color:white;

    font-size:17px;
}

.return{
    font-size:21px;

    font-weight:900;

    color:var(--green);
}

.clear{
    width:100%;

    margin-top:12px;

    padding:10px;

    border:
        1px solid
        var(--border);

    background:#1b2633;

    color:white;

    border-radius:7px;

    cursor:pointer;
}

/* LOADING */

.loading,
.error{
    padding:50px;

    text-align:center;

    color:var(--muted);
}

.error{
    color:#ff8181;
}

.refresh{
    border:0;

    background:var(--green);

    padding:
        8px 13px;

    border-radius:7px;

    font-weight:800;

    cursor:pointer;
}

/* MOBILE */

@media(max-width:1000px){

    .layout{
        grid-template-columns:
            1fr;
    }

    .sidebar{
        position:relative;

        top:0;

        display:flex;

        overflow:auto;

        gap:5px;
    }

    .side-title{
        display:none;
    }

    .sport{
        white-space:nowrap;
    }

    .betslip{
        position:relative;
        top:0;
    }
}

</style>

</head>

<body>

<header>

<div class="logo">
SPORTS<span>+</span>
</div>

<div class="status">

<span class="live-dot"></span>

<span id="updateText">
等待数据
</span>

&nbsp;

<button
class="refresh"
onclick="loadOdds()">

刷新

</button>

</div>

</header>


<div class="layout">

<!-- SPORTS -->

<aside class="sidebar">

<div class="side-title">
体育项目
</div>

<div
class="sport active"
data-sport="soccer_epl">
⚽ 英超
</div>

<div
class="sport"
data-sport="soccer_spain_la_liga">
⚽ 西甲
</div>

<div
class="sport"
data-sport="soccer_germany_bundesliga">
⚽ 德甲
</div>

<div
class="sport"
data-sport="soccer_italy_serie_a">
⚽ 意甲
</div>

<div
class="sport"
data-sport="soccer_france_ligue_one">
⚽ 法甲
</div>

<div
class="sport"
data-sport="soccer_usa_mls">
⚽ MLS
</div>

<div
class="sport"
data-sport="basketball_nba">
🏀 NBA
</div>

<div
class="sport"
data-sport="icehockey_nhl">
🏒 NHL
</div>

</aside>


<!-- EVENTS -->

<main>

<div class="topbar">

<button
class="filter active"
data-filter="all">
全部
</button>

<button
class="filter"
data-filter="today">
今日
</button>

<button
class="filter"
data-filter="tomorrow">
明日
</button>

<input
class="search"
id="search"
placeholder="搜索球队..."
oninput="renderEvents()">

</div>

<div id="events">

<div class="loading">
正在加载比赛...
</div>

</div>

</main>


<!-- BETSLIP -->

<aside class="betslip">

<div class="bet-title">
我的串关
</div>

<div
class="bet-count"
id="betCount">
0 个选择
</div>

<div id="slip"></div>

</aside>

</div>


<script>

let currentSport =
    "soccer_epl";

let currentFilter =
    "all";

let events = [];

let picks = [];

let expanded =
    new Set();

const MARKET_NAMES = {

    h2h:
        "全场赛果",

    spreads:
        "让分 / 让球",

    totals:
        "总分 / 总进球",

    btts:
        "双方进球",

    draw_no_bet:
        "平局退款",

    alternate_spreads:
        "其他让球",

    alternate_totals:
        "其他大小",

    team_totals:
        "球队总分",

    player_points:
        "球员得分",

    player_assists:
        "球员助攻",

    player_rebounds:
        "球员篮板",

    player_threes:
        "球员三分"

};


function marketName(key){

    return MARKET_NAMES[key]
        || key;

}


function formatDate(iso){

    const d =
        new Date(iso);

    return d.toLocaleString(
        "zh-CN",
        {
            month:"numeric",
            day:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function outcomeName(
    outcome,
    event
){

    let name =
        outcome.name;

    if(name === "Draw")
        name="平局";

    if(name === "Over")
        name="大";

    if(name === "Under")
        name="小";

    if(name === "Yes")
        name="是";

    if(name === "No")
        name="否";


    if(outcome.point !== null){

        name +=
            " " +
            (
                outcome.point > 0
                ? "+"
                : ""
            )
            +
            outcome.point;
    }

    return name;

}


async function loadOdds(){

    const container =
        document.getElementById(
            "events"
        );

    container.innerHTML =
        `<div class="loading">
        正在获取最新比赛和赔率...
        </div>`;

    try{

        const response =
    await fetch(
        `/api/odds/${encodeURIComponent(currentSport)}`
    );

const raw =
    await response.text();

let data;

try {

    data = JSON.parse(raw);

} catch {

    throw new Error(
        "服务器返回异常：" +
        raw.substring(0, 200)
    );

}

        if(!response.ok){

            throw new Error(
                data.message ||
                data.error ||
                "赔率接口请求失败"
            );
        }

        events =
            data.events || [];

        document.getElementById(
            "updateText"
        ).innerText =
            "更新于 "
            +
            new Date(
                data.updated
            ).toLocaleTimeString(
                "zh-CN",
                {
                    hour:"2-digit",
                    minute:"2-digit",
                    second:"2-digit"
                }
            );

        renderEvents();

    }

    catch(error){

        container.innerHTML =

        `<div class="error">

        无法加载比赛

        <br><br>

        ${error.message}

        </div>`;

    }

}


function getBestMarkets(event){

    if(
        !event.bookmakers ||
        event.bookmakers.length===0
    ){
        return [];
    }

    /*
      第一版实时实现：
      使用 API 返回的第一个 bookmaker。
      后面可以指定某一家或做聚合。
    */

    return event
        .bookmakers[0]
        .markets || [];

}


function renderEvents(){

    const container =
        document.getElementById(
            "events"
        );

    const query =
        document.getElementById(
            "search"
        ).value
        .trim()
        .toLowerCase();


    const now =
        new Date();

    const today =
        now.toDateString();

    const tomorrow =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()+1
        ).toDateString();


    const filtered =
        events.filter(event=>{

            const text =
                (
                    event.home_team
                    +
                    " "
                    +
                    event.away_team
                )
                .toLowerCase();

            if(
                query &&
                !text.includes(query)
            ){
                return false;
            }


            const date =
                new Date(
                    event.commence_time
                )
                .toDateString();


            if(
                currentFilter ===
                "today"
            ){
                return date === today;
            }


            if(
                currentFilter ===
                "tomorrow"
            ){
                return date === tomorrow;
            }

            return true;

        });


    if(filtered.length===0){

        container.innerHTML =

        `<div class="loading">

        当前分类暂无比赛

        </div>`;

        return;

    }


    container.innerHTML="";


    filtered.forEach(event=>{

        const markets =
            getBestMarkets(event);

        const isExpanded =
            expanded.has(event.id);


        const card =
            document.createElement(
                "div"
            );

        card.className =
            "game";


        let marketsHTML="";


        if(isExpanded){

            markets.forEach(
                (market)=>{

                let oddsHTML="";


                market.outcomes
                .forEach(
                    (outcome)=>{

                    const id =
                        event.id
                        +"|"
                        +market.key
                        +"|"
                        +outcome.name
                        +"|"
                        +(outcome.point ?? "");


                    const selected =
                        picks.some(
                            p=>p.id===id
                        );


                    oddsHTML += `

                    <div
                    class="odd
                    ${selected
                    ? "selected"
                    : ""}"

                    onclick='addPick(
                        ${JSON.stringify(
                            id
                        )},
                        ${JSON.stringify(
                            event.id
                        )},
                        ${JSON.stringify(
                            event.home_team
                        )},
                        ${JSON.stringify(
                            event.away_team
                        )},
                        ${JSON.stringify(
                            market.key
                        )},
                        ${JSON.stringify(
                            outcome.name
                        )},
                        ${JSON.stringify(
                            outcome.point
                        )},
                        ${outcome.price}
                    )'>

                        <span
                        class="odd-name">

                        ${
                            outcomeName(
                                outcome,
                                event
                            )
                        }

                        </span>

                        <span
                        class="price">

                        ${
                            Number(
                                outcome.price
                            )
                            .toFixed(2)
                        }

                        </span>

                    </div>

                    `;

                });


                marketsHTML += `

                <div class="market">

                    <div
                    class="market-name">

                    ${
                        marketName(
                            market.key
                        )
                    }

                    </div>

                    <div
                    class="odds-grid">

                    ${oddsHTML}

                    </div>

                </div>

                `;

            });

        }


        card.innerHTML = `

        <div
        class="game-head"
        onclick="toggleEvent(
            '${event.id}'
        )">

            <div>

                <div
                class="game-time">

                ${
                    formatDate(
                        event.commence_time
                    )
                }

                </div>

                <div class="team">
                    ${event.home_team}
                </div>

                <div class="team">
                    ${event.away_team}
                </div>

            </div>

            <div class="expand">

            ${
                isExpanded
                ? "收起"
                : markets.length
                    +" 个盘口 ›"
            }

            </div>

        </div>


        ${
            isExpanded
            ?
            `<div class="markets">
                ${marketsHTML}
            </div>`
            :
            ""
        }

        `;


        container.appendChild(
            card
        );

    });

}


function toggleEvent(id){

    if(expanded.has(id))
        expanded.delete(id);

    else
        expanded.add(id);

    renderEvents();

}


function addPick(
    id,
    eventId,
    home,
    away,
    market,
    outcome,
    point,
    price
){

    const existing =
        picks.findIndex(
            p=>p.id===id
        );


    if(existing >= 0){

        picks.splice(
            existing,
            1
        );

    }

    else{

        /*
          同一场相同 market
          默认只允许一个 selection
        */

        picks =
            picks.filter(
                p=>!(
                    p.eventId ===
                    eventId
                    &&
                    p.market ===
                    market
                )
            );


        picks.push({

            id,
            eventId,
            home,
            away,
            market,
            outcome,
            point,
            price

        });

    }


    renderEvents();

    renderSlip();

}


function displayOutcome(p){

    let name=p.outcome;

    if(name==="Draw")
        name="平局";

    if(name==="Over")
        name="大";

    if(name==="Under")
        name="小";

    if(name==="Yes")
        name="是";

    if(name==="No")
        name="否";


    if(p.point !== null){

        name +=
            " "
            +
            (
                p.point>0
                ? "+"
                : ""
            )
            +
            p.point;
    }

    return name;

}


function renderSlip(){

    const container =
        document.getElementById(
            "slip"
        );


    document.getElementById(
        "betCount"
    ).innerText =
        picks.length
        +
        " 个选择";


    if(picks.length===0){

        container.innerHTML = `

        <div class="empty">

        点击比赛赔率

        <br>

        创建你的模拟串关

        </div>

        `;

        return;

    }


    let total=1;

    let html="";


    picks.forEach(
        (pick,index)=>{

        total *=
            Number(pick.price);


        html += `

        <div class="pick">

            <div class="pick-top">

                <div>

                    <div
                    class="pick-name">

                    ${
                        displayOutcome(
                            pick
                        )
                    }

                    </div>

                    <div
                    class="pick-event">

                    ${pick.home}
                    vs
                    ${pick.away}

                    </div>

                    <div
                    class="pick-market">

                    ${
                        marketName(
                            pick.market
                        )
                    }

                    </div>

                    <div
                    class="pick-price">

                    ${
                        Number(
                            pick.price
                        )
                        .toFixed(2)
                    }

                    </div>

                </div>


                <button
                class="remove"
                onclick="
                    removePick(
                        ${index}
                    )
                ">

                ×

                </button>

            </div>

        </div>

        `;

    });


    html += `

    <div class="summary">

        <div class="row">

            <span>
            串关
            </span>

            <strong>
            ${picks.length} 串 1
            </strong>

        </div>


        <div class="row">

            <span>
            总赔率
            </span>

            <span
            class="total"
            id="totalOdds">

            ${total.toFixed(2)}

            </span>

        </div>


        <div>

        <div
        style="
        font-size:12px;
        color:#8f9cab;
        margin-bottom:6px;
        ">

        模拟投注金额（CAD）

        </div>


        <input
        class="stake"
        id="stake"
        type="number"
        value="100"
        min="0"
        step="10"
        oninput="
            calculateReturn()
        ">

        </div>


        <div class="row">

            <span>
            模拟返还
            </span>

            <span
            class="return"
            id="return">

            $${(total*100).toFixed(2)}

            </span>

        </div>


        <div class="row">

            <span>
            模拟利润
            </span>

            <strong
            id="profit">

            $${(
                total*100
                -
                100
            ).toFixed(2)}

            </strong>

        </div>


        <button
        class="clear"
        onclick="clearSlip()">

        清空投注单

        </button>

    </div>

    `;


    container.innerHTML =
        html;

}


function calculateReturn(){

    let total=1;

    picks.forEach(
        p=>{
            total *=
                Number(p.price);
        }
    );


    const stake =
        Number(
            document.getElementById(
                "stake"
            ).value
        ) || 0;


    document.getElementById(
        "return"
    ).innerText =
        "$"
        +
        (
            stake*total
        ).toFixed(2);


    document.getElementById(
        "profit"
    ).innerText =
        "$"
        +
        (
            stake*total
            -
            stake
        ).toFixed(2);

}


function removePick(index){

    picks.splice(
        index,
        1
    );

    renderEvents();

    renderSlip();

}


function clearSlip(){

    picks=[];

    renderEvents();

    renderSlip();

}


/* SPORTS */

document
.querySelectorAll(
    ".sport"
)
.forEach(el=>{

    el.addEventListener(
        "click",
        ()=>{

        document
        .querySelectorAll(
            ".sport"
        )
        .forEach(
            x=>
            x.classList.remove(
                "active"
            )
        );


        el.classList.add(
            "active"
        );


        currentSport =
            el.dataset.sport;


        expanded.clear();

        loadOdds();

    });

});


/* FILTERS */

document
.querySelectorAll(
    ".filter"
)
.forEach(el=>{

    el.addEventListener(
        "click",
        ()=>{

        document
        .querySelectorAll(
            ".filter"
        )
        .forEach(
            x=>
            x.classList.remove(
                "active"
            )
        );


        el.classList.add(
            "active"
        );


        currentFilter =
            el.dataset.filter;


        renderEvents();

    });

});


renderSlip();

loadOdds();

</script>

</body>

</html>
